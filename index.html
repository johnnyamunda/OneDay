<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OneDay — Personal Meditation Companion</title>
  
  <meta name="application-name" content="OneDay">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OneDay">
  <meta name="theme-color" content="#181716">
  <meta name="description" content="A calm, quiet personal companion for Scripture, Prayer, Meditation, and Daily Intention.">

  <!-- Embedded Web App Manifest via Data URI -->
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22OneDay%20Practice%22%2C%22short_name%22%3A%22OneDay%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23181716%22%2C%22theme_color%22%3A%22%23181716%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22apple-touch-icon.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    :root {
      --bg: #f8f6f2;
      --card-bg: #ffffff;
      --text-main: #2a2825;
      --text-muted: #736f69;
      --accent: #8c7355;
      --accent-soft: #f0eae1;
      --border: #e8e3dc;
      --timer-bg: #181716;
      --timer-text: #f0ede6;
      --timer-dim: #8c8881;
      --success: #526f58;
      --danger: #a2524f;
      --font-serif: "Iowan Old Style", "Apple Garamond", "Baskerville", "Times New Roman", "Droid Serif", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --radius: 12px;
      --trans: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="dark"] {
      --bg: #141312;
      --card-bg: #1c1b19;
      --text-main: #e8e5de;
      --text-muted: #969188;
      --accent: #c4a47c;
      --accent-soft: #282521;
      --border: #2e2c28;
      --timer-bg: #0c0b0b;
      --timer-text: #edeae2;
      --timer-dim: #6d6962;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    #app-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    header {
      padding: 16px 20px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      letter-spacing: 0.05em;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title:hover {
      opacity: 0.85;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .user-profile-badge {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      cursor: pointer;
    }

    .user-profile-name {
      font-size: 0.72rem;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-top: -3px;
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 8px;
      font-size: 1.15rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover {
      color: var(--text-main);
      background: var(--accent-soft);
    }

    main {
      flex: 1;
      padding: 10px 18px 96px;
      display: flex;
      flex-direction: column;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
      word-break: break-word;
      overflow: hidden;
    }

    h2 {
      font-family: var(--font-serif);
      font-size: 1.45rem;
      font-weight: 500;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    h3 {
      font-family: var(--font-serif);
      font-size: 1.22rem;
      font-weight: 500;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    p {
      color: var(--text-muted);
      font-size: 0.96rem;
      margin-bottom: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 18px;
      font-size: 0.98rem;
      font-weight: 500;
      border-radius: var(--radius);
      border: 1px solid transparent;
      cursor: pointer;
      transition: var(--trans);
      text-decoration: none;
      text-align: center;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--text-main);
      color: var(--bg);
    }

    .btn-primary:active {
      transform: scale(0.985);
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--accent-soft);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:active {
      background: var(--border);
    }

    .btn-quiet {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
      padding: 10px;
    }

    .btn-quiet:hover {
      color: var(--text-main);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 13px 15px;
      font-size: 0.98rem;
      font-family: inherit;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
      line-height: 1.6;
      font-family: var(--font-serif);
      font-size: 1.02rem;
    }

    /* Dual Stage & Cumulative Live Timer Cluster */
    .stage-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      gap: 6px;
    }

    .stage-chip {
      font-size: 0.78rem;
      padding: 5px 10px;
      border-radius: 20px;
      background: var(--accent-soft);
      color: var(--text-main);
      font-weight: 500;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .stage-live-timer {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.84rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
      background: var(--card-bg);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .timer-stage-badge {
      color: var(--accent);
    }

    .timer-divider {
      color: var(--border);
      font-weight: normal;
    }

    .timer-total-badge {
      color: var(--text-muted);
      font-weight: 500;
    }

    .timer-total-badge strong {
      color: var(--text-main);
    }

    .stage-exit-btn {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 0.84rem;
      cursor: pointer;
      font-weight: 500;
      padding: 6px 4px;
      white-space: nowrap;
    }

    .stage-back-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.84rem;
      cursor: pointer;
      font-weight: 500;
      padding: 6px 4px;
      white-space: nowrap;
    }

    .stage-back-btn:hover {
      color: var(--text-main);
    }

    .reading-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      -webkit-overflow-scrolling: touch;
    }

    .reading-tab-btn {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-muted);
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
      transition: var(--trans);
    }

    .reading-tab-btn.active {
      background: var(--text-main);
      color: var(--bg);
      border-color: var(--text-main);
    }

    .reading-tab-btn.patristic-tab {
      border-color: var(--accent);
      color: var(--accent);
    }

    .reading-tab-btn.patristic-tab.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    /* Top Action Bar for Scripture Audio & Source */
    .reading-top-toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin: 10px 0 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .reading-top-toolbar .btn-secondary {
      padding: 9px 14px;
      font-size: 0.88rem;
      border-radius: 20px;
      width: auto;
      flex: 1;
    }

    .reading-content-container {
      margin: 14px 0 24px;
      user-select: text;
      -webkit-user-select: text;
      line-height: 1.9;
    }

    .reading-citation {
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .reading-theme {
      font-family: var(--font-serif);
      font-size: 1.08rem;
      font-style: italic;
      color: var(--accent);
      margin-bottom: 18px;
      line-height: 1.65;
    }

    .reading-para {
      font-family: var(--font-serif);
      font-size: 1.08rem;
      line-height: 1.9;
      color: var(--text-main);
      margin-bottom: 1.5rem;
      letter-spacing: 0.01em;
    }

    .reading-para:last-child {
      margin-bottom: 0;
    }

    .reading-rubric {
      font-family: var(--font-sans);
      font-size: 0.84rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin: 16px 0 8px;
      font-weight: 600;
    }

    /* Responsorial Psalm Refrain Styling */
    .psalm-refrain-box {
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      padding: 12px 14px;
      border-radius: 0 var(--radius) var(--radius) 0;
      margin: 16px 0 18px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .psalm-refrain-symbol {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--accent);
      user-select: none;
    }

    .psalm-refrain-text {
      font-family: var(--font-serif);
      font-style: italic;
      color: var(--accent);
      line-height: 1.65;
      font-size: 1.02rem;
    }

    .psalm-stanza {
      font-family: var(--font-serif);
      font-size: 1.06rem;
      line-height: 1.85;
      color: var(--text-main);
      padding-left: 14px;
      border-left: 1.5px solid var(--border);
      margin-bottom: 1.4rem;
    }

    /* Catholic Liturgical Acclamation at end of reading */
    .reading-liturgical-conclusion {
      margin: 22px 0 10px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-family: var(--font-serif);
    }

    .versicle-call {
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .versicle-response {
      font-size: 1.02rem;
      font-style: italic;
      color: var(--accent);
    }

    /* Pocket Anchor Card & Selector */
    .pocket-anchor-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
      transition: var(--trans);
    }

    .pocket-anchor-badge {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .pocket-anchor-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      color: var(--accent);
    }

    .pocket-anchor-verse {
      font-family: var(--font-serif);
      font-size: 1.12rem;
      font-style: italic;
      line-height: 1.6;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .pocket-anchor-source {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: right;
    }

    .pocket-anchor-capture-box {
      background: var(--accent-soft);
      border: 1px dashed var(--accent);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin: 20px 0 16px;
    }

    .pocket-anchor-capture-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pocket-anchor-capture-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .pocket-anchor-capture-row input {
      flex: 1;
      padding: 9px 12px;
      font-size: 0.94rem;
    }

    .pocket-anchor-capture-row button {
      width: auto;
      padding: 0 14px;
      font-size: 0.86rem;
      white-space: nowrap;
    }

    .exegesis-box {
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      padding: 18px 20px;
      border-radius: 0 var(--radius) var(--radius) 0;
      margin: 18px 0;
      font-family: var(--font-serif);
      line-height: 1.78;
      color: var(--text-main);
      font-size: 1.02rem;
      overflow: visible;
      word-wrap: break-word;
    }

    .exegesis-box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }

    .exegesis-box p {
      color: var(--text-main);
      margin-bottom: 12px;
      font-size: 1.01rem;
    }

    .exegesis-box p:last-child {
      margin-bottom: 0;
    }

    .exegesis-box ul {
      margin: 12px 0 16px 20px;
      list-style-type: disc;
    }

    .exegesis-box li {
      margin-bottom: 8px;
      line-height: 1.65;
    }

    .exegesis-box strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .exegesis-loading-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-radius: var(--radius);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.94rem;
      margin: 14px 0;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulseAnim 1.4s infinite ease-in-out;
    }

    @keyframes pulseAnim {
      0%, 100% { opacity: 0.3; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .intention-creator-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
      width: 100%;
    }

    .intention-creator-row input {
      flex: 1;
      min-width: 0;
    }

    .intention-creator-row .btn-add {
      flex-shrink: 0;
      width: auto;
      padding: 0 20px;
      height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      border-radius: var(--radius);
      font-size: 0.95rem;
    }

    .intention-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card-bg);
      margin-bottom: 8px;
      cursor: pointer;
      transition: var(--trans);
    }

    .intention-item.dragging {
      opacity: 0.45;
      background: var(--accent-soft);
      border: 1px dashed var(--accent);
    }

    .intention-item.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      font-weight: 500;
    }

    .intention-drag-handle {
      color: var(--text-muted);
      cursor: grab;
      font-size: 1.1rem;
      padding: 0 4px;
      touch-action: none;
    }

    .intention-text-wrap {
      flex: 1;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .intention-actions {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .btn-item-action {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 4px 6px;
      border-radius: 4px;
    }

    .btn-item-action:hover {
      color: var(--text-main);
      background: rgba(0, 0, 0, 0.05);
    }

    .pill-group {
      display: flex;
      gap: 10px;
      margin: 16px 0;
    }

    .pill-btn {
      flex: 1;
      padding: 15px 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--trans);
      text-align: center;
    }

    .pill-btn.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .flow-list {
      list-style: none;
      margin: 16px 0;
    }

    .flow-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 6px;
      border-bottom: 1px solid var(--border);
      font-size: 0.98rem;
    }

    .flow-item.clickable-flow {
      cursor: pointer;
      border-radius: 8px;
      transition: var(--trans);
    }

    .flow-item.clickable-flow:hover {
      background: var(--accent-soft);
      padding-left: 10px;
      padding-right: 10px;
    }

    .flow-item:last-child {
      border-bottom: none;
    }

    .flow-indicator {
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    .flow-indicator.done {
      color: var(--success);
      font-weight: bold;
    }

    /* Practice Statistics Grid */
    .stats-trio {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 18px 0;
    }

    .stat-card {
      background: var(--accent-soft);
      padding: 16px 8px;
      border-radius: var(--radius);
      text-align: center;
      border: 1px solid var(--border);
    }

    .stat-number {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 1.85rem;
      font-weight: 600;
      color: var(--accent);
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .stat-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stats-comparison-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
    }

    .comparison-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }

    .comparison-title {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .comparison-val {
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .comparison-sub {
      font-size: 0.8rem;
      font-weight: normal;
      color: var(--text-muted);
    }

    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg);

    /**

    class ModalService {
      static showConfirm(message, onConfirm, onCancel = null) {
        const modal = document.getElementById('custom-modal');
        const text = document.getElementById('modal-text');
        const confirmBtn = document.getElementById('modal-confirm-btn');
        const cancelBtn = document.getElementById('modal-cancel-btn');

        text.textContent = message;
        cancelBtn.classList.remove('hidden');
        confirmBtn.textContent = "Confirm";

        const cleanUp = () => {
          modal.classList.add('hidden');
          confirmBtn.onclick = null;
          cancelBtn.onclick = null;
        };

        confirmBtn.onclick = () => {
          cleanUp();
          if (onConfirm) onConfirm();
        };

        cancelBtn.onclick = () => {
          cleanUp();
          if (onCancel) onCancel();
        };

        modal.classList.remove('hidden');
      }

      static showAlert(message, onClose = null) {
        const modal = document.getElementById('custom-modal');
        const text = document.getElementById('modal-text');

        const cancelBtn = document.getElementById('modal-cancel-btn');

        text.textContent = message;
        cancelBtn.classList.add('hidden');
        confirmBtn.textContent = "OK";

        confirmBtn.onclick = () => {
          modal.classList.add('hidden');
          confirmBtn.onclick = null;
          if (onClose) onClose();
        };

        modal.classList.remove('hidden');
      }
    }

    /**
     * Audio Service
     */
    class AudioService {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.isSpeaking = false;
        this.initVoiceEngine();
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      initVoiceEngine() {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.getVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
          window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }
      }

      findBestVoice() {
        if (!('speechSynthesis' in window)) return null;
        const voices = window.speechSynthesis.getVoices() || [];
        if (!voices.length) return null;

        const qualityKeywords = ['enhanced', 'premium', 'natural', 'neural', 'siri', 'daniel', 'serena', 'oliver', 'samantha'];
        for (const kw of qualityKeywords) {
          const matched = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes(kw));
          if (matched) return matched;
        }

        const calmEn = voices.find(v => v.lang === 'en-GB' || v.lang === 'en-ZA' || v.lang === 'en-IE' || v.lang === 'en-AU');
        if (calmEn) return calmEn;

        const anyEn = voices.find(v => v.lang.startsWith('en'));
        return anyEn || voices[0];
      }

      playGentleBell() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;

          const freqs = [432, 864, 1296];
          const now = this.ctx.currentTime;

          freqs.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);

            const initialGain = 0.22 / (idx + 1);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(initialGain, now + 0.08);
            gain.gain.exponentialRampToValueAtTime(0.00001, now + 3.4);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 3.5);
          });

          if ('vibrate' in navigator) navigator.vibrate([70, 40, 70]);
        } catch (e) {
          console.warn("Audio chime could not play:", e);
        }
      }

      playMeditationClosingBells() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;

          const chimeTimes = [0, 1.2, 2.4];
          const chimeFreqs = [288, 432, 576];

          chimeTimes.forEach((delay, strikeIdx) => {
            const strikeStart = this.ctx.currentTime + delay;
            const baseFreq = chimeFreqs[strikeIdx];

            [baseFreq, baseFreq * 2].forEach((freq, harmonicIdx) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();

              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, strikeStart);

              const initialGain = 0.26 / (harmonicIdx + 1);
              gain.gain.setValueAtTime(0.0001, strikeStart);
              gain.gain.exponentialRampToValueAtTime(initialGain, strikeStart + 0.08);
              gain.gain.exponentialRampToValueAtTime(0.00001, strikeStart + 3.2);

              osc.connect(gain);
              gain.connect(this.ctx.destination);

              osc.start(strikeStart);
              osc.stop(strikeStart + 3.3);
            });
          });

          if ('vibrate' in navigator) navigator.vibrate([90, 80, 90, 80, 150]);
        } catch (e) {
          console.warn("Closing bell chime could not play:", e);
        }
      }

      speak(text, onEndCallback = null) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();

        const cleanSpokenText = TextFormatter.sanitizeForSpeech(text);
        if (!cleanSpokenText) return;

        const utterance = new SpeechSynthesisUtterance(cleanSpokenText);
        utterance.rate = 0.88;
        utterance.pitch = 1.0;

        const bestVoice = this.findBestVoice();
        if (bestVoice) {
          utterance.voice = bestVoice;
          utterance.lang = bestVoice.lang;
        } else {
          utterance.lang = 'en-GB';
        }

        utterance.onend = () => {
          this.isSpeaking = false;
          if (onEndCallback) onEndCallback();
        };

        utterance.onerror = () => {
          this.isSpeaking = false;
          if (onEndCallback) onEndCallback();
        };

        this.isSpeaking = true;
        window.speechSynthesis.speak(utterance);
      }

      stopSpeech() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          this.isSpeaking = false;
        }
      }
    }

    /**
     * Resilient Screen Wake Lock Service
     */
    class WakeLockService {
      constructor() {
        this.lock = null;
        this.isActiveRequested = false;
        this.initVisibilityListener();
      }

      initVisibilityListener() {
        document.addEventListener('visibilitychange', async () => {
          if (document.visibilityState === 'visible' && this.isActiveRequested) {
            await this.request();
            if (AppState.activeSession) {
              PracticeMachine.syncTimerDisplayFromTimestamps();
            }
          }
        });
      }

      async request() {
        this.isActiveRequested = true;
        if ('wakeLock' in navigator) {
          try {
            if (this.lock) {
              await this.lock.release();
              this.lock = null;
            }
            this.lock = await navigator.wakeLock.request('screen');
            this.lock.addEventListener('release', () => {
              this.lock = null;
            });
          } catch (e) {
            console.log("WakeLock request status:", e);
          }
        }
      }

      release() {
        this.isActiveRequested = false;
        if (this.lock) {
          this.lock.release();
          this.lock = null;
        }
      }
    }

    const wakeLock = new WakeLockService();

    /**
     * Liturgical & Typography Text Formatter
     */
    class TextFormatter {
      static decodeHtmlEntities(str) {
        if (!str) return '';
        const txt = document.createElement('textarea');
        txt.innerHTML = str;
        return txt.value;
      }

      static sanitizeForSpeech(raw, readingTitle = '') {
        if (!raw) return '';
        let s = TextFormatter.decodeHtmlEntities(raw);

        s = s.replace(/Gospel Acclamation[\s\S]*?(?=(?:A reading from|The beginning of|Gospel|Luke|Matthew|Mark|John|$))/i, ' ');
        s = s.replace(/Acclamation[\s\S]*?(?=(?:Luke|Matthew|Mark|John|$))/i, ' ');
        s = s.replace(/Alleluia[^\n.]*[\n.]/gi, ' ');
        s = s.replace(/How to listen[\s\S]*$/gi, ' ');

        s = s.replace(/(\b[1-3]?\s?[A-Za-z]+)\s+(\d+)(?:\s*\(\d+\))?[:,\-–—](\d+)/g, '$1 chapter $2, verse $3. ');
        s = s.replace(/\bPsalm\s+(\d+)(?:\s*\(\d+\))?[:,\-–—](\d+)/gi, 'Psalm $1, verse $2. ');

        s = s.replace(/#\d+;?/gi, ' ');
        s = s.replace(/&[a-z]+;?/gi, ' ');
        s = s.replace(/\(\d+[:\d\-,\s]*\)/g, ' ');
        s = s.replace(/\[\d+\]/g, ' ');
        s = s.replace(/<[^>]+>/g, ' ');

        let cleanSpoken = s.replace(/\s+/g, ' ').trim();

        if (/gospel/i.test(readingTitle)) {
          cleanSpoken += ". The Gospel of the Lord. Praise to you, Lord Jesus Christ.";
        } else if (/reading|patristic/i.test(readingTitle)) {
          cleanSpoken += ". The word of the Lord. Thanks be to God.";
        }

        return cleanSpoken;
      }

      static formatReadingHtml(rawText, readingTitle = '') {
        if (!rawText) return '';
        
        let cleaned = TextFormatter.decodeHtmlEntities(rawText).trim();

        cleaned = cleaned.replace(/How to listen[\s\S]*?(?=\n\n|$)/gi, '');
        cleaned = cleaned.replace(/Get the official Universalis app[\s\S]*?(?=\n\n|$)/gi, '');
        cleaned = cleaned.replace(/You can read the Gospels in Greek[\s\S]*?(?=\n\n|$)/gi, '');
        cleaned = cleaned.replace(/The texts will be more readable[\s\S]*?(?=\n\n|$)/gi, '');
        cleaned = cleaned.replace(/Optional subscription:[\s\S]*?(?=\n\n|$)/gi, '');
        cleaned = cleaned.replace(/Christian Art[\s\S]*?(?=\n\n|$)/gi, '');

        cleaned = cleaned.replace(/Acclamation[\s\S]*?(?=(?:The Holy Gospel|Gospel\b(?!\s*Acclamation)|Luke|Matthew|Mark|John)\b)/i, '');
        cleaned = cleaned.replace(/^Gospel Acclamation[\s\S]*?(?=(?:A reading from|The beginning of|The Lord said|Jesus|In those days|Luke|Matthew|Mark|John|\n\n))/i, '');
        cleaned = cleaned.replace(/^(First Reading|Second Reading|Gospel|Responsorial Psalm|The Holy Gospel)\s*/i, '').trim();

        cleaned = cleaned.replace(/(\b\d+(?:\s*\(\d+\))?(?:[:,\-–—]\d+)*)(['"“‘]?\s*[A-Za-z])/g, '$1\n\n$2');
        cleaned = cleaned.replace(/(?:Gospel|Psalm|Reading|Acclamation)(['"“‘]?\s*[A-Za-z])/g, '$1\n\n$2');
        cleaned = cleaned.replace(/(cf\.|Or:)([A-Z])/g, '$1 $2');

        const rawParagraphs = cleaned.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
        const paragraphs = [];

        rawParagraphs.forEach(p => {
          const citeMatch = p.match(/^([1-3]?\s?[A-Za-z]+|\bPsalm\b)\s+(\d+(?:\s*\(\d+\))?(?:[:,\-–—]\d+)*)(['"“‘]?\s*[\s\S]*)$/i);
          if (citeMatch && citeMatch[3] && citeMatch[3].trim().length > 0) {
            paragraphs.push(`${citeMatch[1]} ${citeMatch[2]}`.trim());
            paragraphs.push(citeMatch[3].trim());
          } else {
            paragraphs.push(p);
          }
        });

        let citationFound = false;
        let detectedRefrain = '';

        let bodyHtml = paragraphs.map((p, idx) => {
          if (!citationFound && idx === 0 && /^([1-3]?\s?[A-Za-z]+|\bPsalm\b)\s+\d+/i.test(p) && p.length < 80) {
            citationFound = true;
            return `<div class="reading-citation">${p}</div>`;
          }

          const isExplicitRefrain = /^(Response:|R\.|℟\.)/i.test(p);
          const isRefrainCandidate = (/^(Lord,|The Lord|My soul|Those who|Anyone who|Happy indeed|Blessed are|May the Lord|In every age|I rejoiced)/i.test(p) && p.length < 130);
          
          if (isExplicitRefrain || (isRefrainCandidate && (idx === 1 || !detectedRefrain || p === detectedRefrain))) {
            const cleanRefrainText = p.replace(/^(Response:|R\.|℟\.)\s*/i, '').trim();
            if (!detectedRefrain) detectedRefrain = cleanRefrainText;
            return `
              <div class="psalm-refrain-box">
                <span class="psalm-refrain-symbol">℟.</span>
                <span class="psalm-refrain-text">${cleanRefrainText}</span>
              </div>
            `;
          }

          if (/psalm/i.test(readingTitle) && p.length > 25) {
            return `<div class="psalm-stanza">${p.replace(/\n/g, '<br>')}</div>`;
          }

          if (citationFound && idx === 1 && p.length < 110 && !/^(The Lord|In those days|Jesus|Paul|Brothers|Hear the word|A reading)/i.test(p)) {
            return `<div class="reading-theme">${p}</div>`;
          }

          if (/^(A reading from|The beginning of)/i.test(p) && p.length < 90) {
            return `<div class="reading-rubric">${p}</div>`;
          }

          const withBreaks = p.replace(/\n/g, '<br>');
          return `<p class="reading-para">${withBreaks}</p>`;
        }).join('');

        if (/gospel/i.test(readingTitle)) {
          bodyHtml += `
            <div class="reading-liturgical-conclusion">
              <div class="versicle-call">The Gospel of the Lord.</div>
              <div class="versicle-response">℟. Praise to you, Lord Jesus Christ.</div>
            </div>
          `;
        } else if (/reading|patristic/i.test(readingTitle)) {
          bodyHtml += `
            <div class="reading-liturgical-conclusion">
              <div class="versicle-call">The word of the Lord.</div>
              <div class="versicle-response">℟. Thanks be to God.</div>
            </div>
          `;
        } else if (/psalm/i.test(readingTitle) && detectedRefrain) {
          bodyHtml += `
            <div class="psalm-refrain-box" style="margin-top:20px;">
              <span class="psalm-refrain-symbol">℟.</span>
              <span class="psalm-refrain-text">${detectedRefrain}</span>
            </div>
          `;
        }

        return bodyHtml;
      }

      static formatExegesisHtml(rawText) {
        if (!rawText) return '';

        let text = TextFormatter.decodeHtmlEntities(rawText).trim();
        text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

        const lines = text.split('\n');
        let html = '';
        let inList = false;

        lines.forEach(line => {
          const trimmed = line.trim();
          if (!trimmed) {
            if (inList) { html += '</ul>'; inList = false; }
            return;
          }

          if (/^[-*•]\s+/.test(trimmed)) {
            if (!inList) { html += '<ul>'; inList = true; }
            html += `<li>${trimmed.replace(/^[-*•]\s+/, '')}</li>`;
          } else {
            if (inList) { html += '</ul>'; inList = false; }
            html += `<p>${trimmed}</p>`;
          }
        });

        if (inList) html += '</ul>';
        return html;
      }
    }

    /**
     * Background Exegesis Manager
     */
    class ExegesisManager {
      static isPending(dateKey) {
        return Boolean(AppState.pendingExegesis[dateKey]);
      }

      static async requestInBackground(readingTitle, readingText, dateKey, onComplete = null) {
        if (AppState.pendingExegesis[dateKey]) return;

        AppState.pendingExegesis[dateKey] = true;

        try {
          const res = await ApiService.request('getExegesis', {
            readingTitle: readingTitle,
            readingText: readingText,
            dateKey: dateKey
          });

          if (res && res.success && res.exegesis) {
            AppState.exegesisCache[dateKey] = res.exegesis;
            localStorage.setItem(STORAGE_KEY_EXEGESIS_CACHE, JSON.stringify(AppState.exegesisCache));
          }
        } catch (e) {
          console.warn("Background exegesis error:", e);
        } finally {
          delete AppState.pendingExegesis[dateKey];
          if (onComplete) onComplete();
        }
      }
    }

    /**
     * API Service
     */
    class ApiService {
      static async request(action, payload = {}) {
        if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === "YOUR_APPS_SCRIPT_URL") {
          return ApiService.mockResponse(action, payload);
        }

        try {
          const body = {
            action: action,
            token: AppState.authToken,
            ...payload
          };

          const res = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'cors',
            redirect: 'follow',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(body)
          });

          if (!res.ok) throw new Error("HTTP status " + res.status);
          const data = await res.json();
          return data;
        } catch (err) {
          console.warn("API request fallback to local mode:", err);
          return ApiService.mockResponse(action, payload);
        }
      }

      static mockResponse(action, payload) {
        return new Promise((resolve) => {
          setTimeout(() => {
            if (action === 'getReadings') {
              resolve({ success: true, readings: AppState.readings });
            } else if (action === 'getExegesis') {
              resolve({
                success: true,
                cached: false,
                exegesis: "Paul contrasts living under external obligation with walking in the freedom of the Spirit.\n\nKey spiritual reflections:\n* The 'flesh' represents self-enclosed living, whereas the Spirit draws us outward in love.\n* The fruit of the Spirit unfolds naturally when we abide in stillness rather than forced effort.\n* Practice gentleness and patience in ordinary actions today."
              });
            } else {
              resolve({ success: true, message: "Processed locally" });
            }
          }, 300);
        });
      }
    }

    /**
     * State Machine & Practice Controller
     */
    const PracticeStates = {
      IDLE: 'IDLE',
      SCRIPTURE: 'SCRIPTURE',
      REFLECTION: 'REFLECTION',
      PRAYER_SERENITY: 'PRAYER_SERENITY',
      PRAYER_PERSONAL: 'PRAYER_PERSONAL',
      PRAYER_JESUS: 'PRAYER_JESUS',
      FOCUSED_MEDITATION: 'FOCUSED_MEDITATION',
      OPEN_MONITORING: 'OPEN_MONITORING',
      MEDITATION_REVIEW: 'MEDITATION_REVIEW',
      INTENTION_SELECT: 'INTENTION_SELECT',
      CLOSING_SCREEN: 'CLOSING_SCREEN'
    };

    class PracticeMachine {
      static startSession(customDurations = {}) {
        sound.init();
        wakeLock.request();

        Router.fetchDailyReadingsInBackground();

        const todayStr = new Date().toISOString().split('T')[0];

        if (AppState.todayReflection.date !== todayStr) {
          AppState.todayReflection = {
            date: todayStr,
            readingRef: '',
            q1: '',
            q2: '',
            q3: ''
          };
          localStorage.removeItem(STORAGE_KEY_TODAY_REFLECTION);
        }

        let initialIntention = AppState.lastChosenIntention;
        if (!initialIntention && AppState.settings.predefinedIntentions.length > 0) {
          initialIntention = AppState.settings.predefinedIntentions[0].text;
        }

        const currentRefl = (AppState.todayReflection.date === todayStr) ? {
          q1: AppState.todayReflection.q1 || '',
          q2: AppState.todayReflection.q2 || '',
          q3: AppState.todayReflection.q3 || ''
        } : { q1: '', q2: '', q3: '' };

        AppState.activeSession = {
          sessionId: 'sess_' + Date.now(),
          startTimestamp: Date.now(),
          date: todayStr,
          startTime: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          durations: {
            scripture: customDurations.scripture || AppState.settings.scriptureDuration,
            reflection: customDurations.reflection || AppState.settings.reflectionDuration,
            prayer: customDurations.prayer || AppState.settings.prayerDuration,
            jesusPrayer: customDurations.jesusPrayer || AppState.settings.jesusPrayerDuration || 1,
            focused: customDurations.focused || AppState.settings.focusedDuration,
            open: customDurations.open || AppState.settings.openDuration
          },
          reflections: currentRefl,
          experience: 'Fine',
          experienceNote: '',
          selectedIntention: initialIntention || '',
          state: PracticeStates.SCRIPTURE,
          completedStages: []
        };

        PracticeMachine.persistCurrentSession();
        Router.navigate('practice');
        PracticeMachine.startActiveStageTimer();
      }

      static persistCurrentSession() {
        if (AppState.activeSession) {
          localStorage.setItem(STORAGE_KEY_PRACTICE, JSON.stringify(AppState.activeSession));
        } else {
          localStorage.removeItem(STORAGE_KEY_PRACTICE);
        }
      }

      static restoreSession() {
        const stored = localStorage.getItem(STORAGE_KEY_PRACTICE);
        if (stored) {
          try {
            const session = JSON.parse(stored);
            const todayStr = new Date().toISOString().split('T')[0];
            if (session.date !== todayStr || session.state === PracticeStates.CLOSING_SCREEN) {
              localStorage.removeItem(STORAGE_KEY_PRACTICE);
              AppState.activeSession = null;
              return false;
            }
            AppState.activeSession = session;
            return true;
          } catch (e) {
            localStorage.removeItem(STORAGE_KEY_PRACTICE);
          }
        }
        return false;
      }

      static stopTimer() {
        if (AppState.timer.intervalId) {
          clearInterval(AppState.timer.intervalId);
          AppState.timer.intervalId = null;
        }
        AppState.timer.targetTimestamp = null;
        AppState.timer.startTimestamp = null;
        AppState.timer.elapsedSeconds = 0;
        AppState.timer.remainingSeconds = 0;
        AppState.timer.isPaused = false;
        AppState.timer.isCountUp = false;
      }

      static syncTimerDisplayFromTimestamps() {
        if (!AppState.activeSession) return;
        const now = Date.now();

        if (AppState.timer.isCountUp && AppState.timer.startTimestamp && !AppState.timer.isPaused) {
          AppState.timer.elapsedSeconds = Math.floor((now - AppState.timer.startTimestamp) / 1000);
          PracticeMachine.updateStageLiveTimerDisplay(false);
        } else if (!AppState.timer.isCountUp && AppState.timer.targetTimestamp && !AppState.timer.isPaused) {
          const diff = Math.max(0, Math.round((AppState.timer.targetTimestamp - now) / 1000));
          AppState.timer.remainingSeconds = diff;
          PracticeMachine.updateStageLiveTimerDisplay(true);

          const displayEl = document.getElementById('timer-display');
          if (displayEl) {
            const mins = Math.floor(diff / 60);
            const secs = diff % 60;
            displayEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
          }
        }
      }

      static startActiveStageTimer() {
        PracticeMachine.stopTimer();
        if (!AppState.activeSession) return;

        const current = AppState.activeSession.state;

        if (current === PracticeStates.PRAYER_JESUS) {
          const jpMins = (AppState.activeSession.durations && AppState.activeSession.durations.jesusPrayer) || 1;
          const jpSeconds = jpMins * 60;

          AppState.timer.isCountUp = false;
          AppState.timer.remainingSeconds = jpSeconds;
          AppState.timer.targetTimestamp = Date.now() + jpSeconds * 1000;
          AppState.timer.isPaused = false;

          PracticeMachine.updateStageLiveTimerDisplay(true);

          AppState.timer.intervalId = setInterval(() => {
            if (!AppState.timer.isPaused && AppState.timer.targetTimestamp) {
              const now = Date.now();
              const diff = Math.max(0, Math.round((AppState.timer.targetTimestamp - now) / 1000));
              AppState.timer.remainingSeconds = diff;
              PracticeMachine.updateStageLiveTimerDisplay(true);

              if (diff <= 0) {
                PracticeMachine.stopTimer();
                sound.playGentleBell();
                PracticeMachine.advanceState(false);
              }
            }
          }, 500);
          return;
        }

        if (current === PracticeStates.SCRIPTURE || 
            current === PracticeStates.REFLECTION || 
            current === PracticeStates.PRAYER_SERENITY || 
            current === PracticeStates.PRAYER_PERSONAL) {
          
          AppState.timer.isCountUp = true;
          AppState.timer.elapsedSeconds = 0;
          AppState.timer.startTimestamp = Date.now();
          AppState.timer.isPaused = false;

          PracticeMachine.updateStageLiveTimerDisplay(false);

          AppState.timer.intervalId = setInterval(() => {
            if (!AppState.timer.isPaused && AppState.timer.startTimestamp) {
              const now = Date.now();
              AppState.timer.elapsedSeconds = Math.floor((now - AppState.timer.startTimestamp) / 1000);
              PracticeMachine.updateStageLiveTimerDisplay(false);
            }
          }, 1000);
          return;
        }

        if (current === PracticeStates.FOCUSED_MEDITATION) {
          PracticeMachine.launchFullscreenTimer(AppState.activeSession.durations.focused * 60, "Stage 3.1", "Focused Attention", false);
          return;
        } else if (current === PracticeStates.OPEN_MONITORING) {
          PracticeMachine.launchFullscreenTimer(AppState.activeSession.durations.open * 60, "Stage 3.2", "Open Monitoring", true);
          return;
        }
      }

      static updateStageLiveTimerDisplay(isCountdown = false) {
        const stageEl = document.getElementById('stage-timer-clock');
        if (stageEl) {
          const totalSecs = isCountdown ? (AppState.timer.remainingSeconds || 0) : (AppState.timer.elapsedSeconds || 0);
          const mins = Math.floor(totalSecs / 60);
          const secs = totalSecs % 60;
          stageEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        const totalEl = document.getElementById('session-total-clock');
        if (totalEl && AppState.activeSession && AppState.activeSession.startTimestamp) {
          const totalElapsed = Math.max(0, Math.floor((Date.now() - AppState.activeSession.startTimestamp) / 1000));
          const tMins = Math.floor(totalElapsed / 60);
          const tSecs = totalElapsed % 60;
          totalEl.textContent = `${String(tMins).padStart(2, '0')}:${String(tSecs).padStart(2, '0')}`;
        }
      }

      static advanceState(manual = true) {
        if (!AppState.activeSession) return;
        PracticeMachine.stopTimer();
        sound.stopSpeech();

        const current = AppState.activeSession.state;
        if (!AppState.activeSession.completedStages.includes(current)) {
          AppState.activeSession.completedStages.push(current);
        }

        switch (current) {
          case PracticeStates.SCRIPTURE:
            AppState.activeSession.state = PracticeStates.REFLECTION;
            break;
          case PracticeStates.REFLECTION:
            AppState.activeSession.state = PracticeStates.PRAYER_SERENITY;
            break;
          case PracticeStates.PRAYER_SERENITY:
            AppState.activeSession.state = PracticeStates.PRAYER_PERSONAL;
            break;
          case PracticeStates.PRAYER_PERSONAL:
            AppState.activeSession.state = PracticeStates.PRAYER_JESUS;
            break;
          case PracticeStates.PRAYER_JESUS:
            AppState.activeSession.state = PracticeStates.FOCUSED_MEDITATION;
            break;
          case PracticeStates.FOCUSED_MEDITATION:
            AppState.activeSession.state = PracticeStates.OPEN_MONITORING;
            break;
          case PracticeStates.OPEN_MONITORING:
            wakeLock.release();
            AppState.activeSession.state = PracticeStates.MEDITATION_REVIEW;
            break;
          case PracticeStates.MEDITATION_REVIEW:
            AppState.activeSession.state = PracticeStates.INTENTION_SELECT;
            break;
          case PracticeStates.INTENTION_SELECT:
            if (AppState.activeSession.selectedIntention) {
              AppState.lastChosenIntention = AppState.activeSession.selectedIntention;
              localStorage.setItem(STORAGE_KEY_LAST_INTENTION, AppState.lastChosenIntention);
            }
            AppState.activeSession.state = PracticeStates.CLOSING_SCREEN;
            PracticeMachine.persistCompletedSession();
            break;
          case PracticeStates.CLOSING_SCREEN:
            AppState.activeSession = null;
            PracticeMachine.persistCurrentSession();
            Router.navigate('today');
            return;
          default:
            AppState.activeSession.state = PracticeStates.IDLE;
        }

        PracticeMachine.persistCurrentSession();
        Router.render();
        PracticeMachine.startActiveStageTimer();
      }

      static navigateBackToScripture() {
        if (!AppState.activeSession) return;
        
        const q1 = document.getElementById('refl-q1');
        const q2 = document.getElementById('refl-q2');
        const q3 = document.getElementById('refl-q3');

        if (q1 || q2 || q3) {
          const answers = {
            q1: q1 ? q1.value : (AppState.activeSession.reflections.q1 || ''),
            q2: q2 ? q2.value : (AppState.activeSession.reflections.q2 || ''),
            q3: q3 ? q3.value : (AppState.activeSession.reflections.q3 || '')
          };
          AppState.activeSession.reflections = answers;
          AppState.todayReflection.q1 = answers.q1;
          AppState.todayReflection.q2 = answers.q2;
          AppState.todayReflection.q3 = answers.q3;
          localStorage.setItem(STORAGE_KEY_TODAY_REFLECTION, JSON.stringify(AppState.todayReflection));
        }

        PracticeMachine.stopTimer();
        AppState.activeSession.state = PracticeStates.SCRIPTURE;
        PracticeMachine.persistCurrentSession();
        Router.render();
        PracticeMachine.startActiveStageTimer();
      }

      static launchFullscreenTimer(durationSeconds, stageName, substageName, isOpenAwareness = false) {
        PracticeMachine.stopTimer();

        const overlay = document.getElementById('timer-overlay');
        const stageEl = document.getElementById('timer-stage-name');
        const substageEl = document.getElementById('timer-substage-name');
        const displayEl = document.getElementById('timer-display');
        const pauseBtn = document.getElementById('timer-pause-btn');

        stageEl.textContent = stageName;
        substageEl.textContent = substageName;
        overlay.classList.remove('hidden');

        AppState.timer.isCountUp = false;
        AppState.timer.remainingSeconds = durationSeconds;
        AppState.timer.isPaused = false;
        AppState.timer.targetTimestamp = Date.now() + durationSeconds * 1000;
        pauseBtn.textContent = "Pause";

        const updateDisplay = () => {
          const mins = Math.floor(AppState.timer.remainingSeconds / 60);
          const secs = AppState.timer.remainingSeconds % 60;
          displayEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        };

        updateDisplay();
        sound.playGentleBell();

        AppState.timer.intervalId = setInterval(() => {
          if (!AppState.timer.isPaused && AppState.timer.targetTimestamp) {
            const now = Date.now();
            const diff = Math.max(0, Math.round((AppState.timer.targetTimestamp - now) / 1000));
            AppState.timer.remainingSeconds = diff;
            updateDisplay();

            if (diff <= 0) {
              PracticeMachine.stopTimer();
              overlay.classList.add('hidden');

              if (isOpenAwareness) {
                sound.playMeditationClosingBells();
              } else {
                sound.playGentleBell();
              }

              PracticeMachine.advanceState(false);
            }
          }
        }, 500);
      }

      static togglePause() {
        const pauseBtn = document.getElementById('timer-pause-btn');
        if (AppState.timer.isPaused) {
          AppState.timer.isPaused = false;
          AppState.timer.targetTimestamp = Date.now() + AppState.timer.remainingSeconds * 1000;
          if (pauseBtn) pauseBtn.textContent = "Pause";
        } else {
          AppState.timer.isPaused = true;
          if (pauseBtn) pauseBtn.textContent = "Resume";
        }
      }

      static extendTimer(extraSeconds = 120) {
        AppState.timer.remainingSeconds += extraSeconds;
        if (AppState.timer.targetTimestamp) {
          AppState.timer.targetTimestamp += extraSeconds * 1000;
        }
        const mins = Math.floor(AppState.timer.remainingSeconds / 60);
        const secs = AppState.timer.remainingSeconds % 60;
        document.getElementById('timer-display').textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      static reduceTimer(subSeconds = 120) {
        AppState.timer.remainingSeconds = Math.max(60, AppState.timer.remainingSeconds - subSeconds);
        if (AppState.timer.targetTimestamp) {
          AppState.timer.targetTimestamp = Date.now() + AppState.timer.remainingSeconds * 1000;
        }
        const mins = Math.floor(AppState.timer.remainingSeconds / 60);
        const secs = AppState.timer.remainingSeconds % 60;
        document.getElementById('timer-display').textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      static skipStage() {
        PracticeMachine.stopTimer();
        document.getElementById('timer-overlay').classList.add('hidden');
        PracticeMachine.advanceState(true);
      }

      static endPracticeEarly() {
        ModalService.showConfirm("End today's practice session early and proceed to closing?", () => {
          PracticeMachine.stopTimer();
          sound.stopSpeech();
          wakeLock.release();
          document.getElementById('timer-overlay').classList.add('hidden');

          if (AppState.activeSession) {
            AppState.activeSession.endedEarly = true;
            if (AppState.activeSession.selectedIntention) {
              AppState.lastChosenIntention = AppState.activeSession.selectedIntention;
              localStorage.setItem(STORAGE_KEY_LAST_INTENTION, AppState.lastChosenIntention);
            }
            AppState.activeSession.state = PracticeStates.CLOSING_SCREEN;
            PracticeMachine.persistCompletedSession();
            Router.render();
          }
        });
      }

      static async persistCompletedSession() {
        wakeLock.release();

        if (AppState.activeSession) {
          const now = Date.now();
          const elapsedMins = Math.max(1, Math.round((now - (AppState.activeSession.startTimestamp || now)) / 60000));
          AppState.activeSession.endTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          AppState.activeSession.durationMinutes = elapsedMins;
          AppState.activeSession.status = AppState.activeSession.endedEarly ? 'interrupted' : 'completed';

          ApiService.request('savePracticeSession', { session: AppState.activeSession });
          if (AppState.activeSession.reflections) {
            const todayReading = AppState.readings[AppState.currentReadingIndex] || AppState.readings[0];
            ApiService.request('saveReflection', {
              reflection: {
                sessionId: AppState.activeSession.sessionId,
                date: AppState.activeSession.date,
                readingRef: todayReading ? todayReading.title : "Today's Reading",
                answers: AppState.activeSession.reflections
              }
            });
          }

          localStorage.removeItem(STORAGE_KEY_PRACTICE);
        }
      }
    }

          btn.addEventListener('click', () => {

      static async fetchDailyReadingsInBackground() {
        const todayStr = new Date().toISOString().split('T')[0];
        const isSaturday = (new Date().getDay() === 6);
        const cached = localStorage.getItem(STORAGE_KEY_READINGS_CACHE);
        
        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            if (parsed.date === todayStr && Array.isArray(parsed.readings) && parsed.readings.length > 0) {
              AppState.readings = parsed.readings;
              Router.ensureSaturdayPatristicPresence(isSaturday);
              return;
            }
          } catch (e) {}
        }

        try {
          const res = await ApiService.request('getReadings', { forcePatristic: isSaturday });
          if (res && res.success && Array.isArray(res.readings) && res.readings.length > 0) {
            AppState.readings = res.readings.filter(r => !/acclamation/i.test(r.title));
            Router.ensureSaturdayPatristicPresence(isSaturday);
            
            localStorage.setItem(STORAGE_KEY_READINGS_CACHE, JSON.stringify({
              date: todayStr,
              readings: AppState.readings
            }));
            
            if (AppState.currentRoute === 'scripture_standalone' || 
               (AppState.activeSession && AppState.activeSession.state === PracticeStates.SCRIPTURE)) {
              Router.render();
            }
          } else {
            Router.ensureSaturdayPatristicPresence(isSaturday);
          }
        } catch (e) {
          console.warn("Could not pre-fetch daily readings:", e);
          Router.ensureSaturdayPatristicPresence(isSaturday);
        }
      }

      static ensureSaturdayPatristicPresence(isSaturday) {
        if (!isSaturday) return;
        const exists = AppState.readings.some(r => r.id === 'patristic' || /patristic/i.test(r.title));
        if (!exists) {
          AppState.readings.push({
            id: 'patristic',
            title: "Patristic Reading",
            content: "From the Confessions of Saint Augustine, bishop\n\nLate have I loved you, O Beauty ever ancient, ever new!\n\nLate have I loved you, O Beauty ever ancient, ever new, late have I loved you! You were within me, but I was in the world outside myself. I made love to the beautiful things you made, nor did I see that they were only reflections of your splendour.\n\nYou were with me, but I was not with you. The lovely things of this world kept me far from you, though they would not have existed at all had they not been in you.\n\nYou called, you shouted, you broke through my deafness. You flashed, you shone, you dispelled my darkness. You breathed your fragrance upon me; I drew in my breath and now I pant for you. I have tasted you, now I hunger and thirst for more. You touched me, and I burned for your peace."
          });
        }
      }

      static async checkSundayHomily() {
        const cached = localStorage.getItem(STORAGE_KEY_HOMILY_CACHE);
        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            AppState.sundayHomily = parsed;
          } catch (e) {}
        }

        const res = await ApiService.request('getSundayHomily');
        if (res && res.success && res.homily) {
          AppState.sundayHomily = res.homily;
          localStorage.setItem(STORAGE_KEY_HOMILY_CACHE, JSON.stringify(res.homily));
          if (AppState.currentRoute === 'today' || AppState.currentRoute === 'scripture_standalone' ||
             (AppState.activeSession && AppState.activeSession.state === PracticeStates.SCRIPTURE)) {
            Router.render();
          }
        }
      }

      static updateHeaderProfileBadge() {
        const nameEl = document.getElementById('header-user-name');
        if (nameEl) {
          if (AppState.currentUser && AppState.currentUser.name) {
            nameEl.textContent = AppState.currentUser.name;
          } else {
            nameEl.textContent = '';
          }
        }
      }

      static async syncTodayReflectionFromBackend() {
        if (!AppState.authToken) return;
        const todayStr = new Date().toISOString().split('T')[0];
        const res = await ApiService.request('getTodayReflection', {
          dateKey: todayStr
        });
        if (res.success) {
          if (res.reflection && res.reflection.answers) {
            AppState.todayReflection.q1 = res.reflection.answers.q1 || '';
            AppState.todayReflection.q2 = res.reflection.answers.q2 || '';
            AppState.todayReflection.q3 = res.reflection.answers.q3 || '';
            AppState.todayReflection.readingRef = res.reflection.readingRef || '';
            AppState.todayReflection.date = todayStr;
            localStorage.setItem(STORAGE_KEY_TODAY_REFLECTION, JSON.stringify(AppState.todayReflection));
          } else {
            AppState.todayReflection = {
              date: todayStr,
              readingRef: '',
              q1: '',
              q2: '',
              q3: ''
            };
            localStorage.removeItem(STORAGE_KEY_TODAY_REFLECTION);
          }
        }
      }

      static navigate(route) {
        if (route !== 'practice' && AppState.timer.intervalId) {
          PracticeMachine.stopTimer();
        }

        AppState.currentRoute = route;

        document.querySelectorAll('nav.bottom-nav button').forEach(b => {
          b.classList.toggle('active', b.dataset.route === route);
        });

        const adminBtn = document.getElementById('admin-nav-btn');
        if (AppState.currentUser && AppState.currentUser.role === 'admin') {
          adminBtn.classList.remove('hidden');
        } else {
          adminBtn.classList.add('hidden');
        }

        Router.updateHeaderProfileBadge();
        Router.render();
      }

      static render() {
        const viewport = document.getElementById('app-viewport');
        sound.stopSpeech();

        switch (AppState.currentRoute) {
          case 'today':
            viewport.innerHTML = Router.renderTodayView();
            Router.bindTodayEvents();
            break;
          case 'practice':
            viewport.innerHTML = Router.renderPracticeFlow();
            Router.bindPracticeEvents();
            break;
          case 'practice_setup':
            viewport.innerHTML = Router.renderPracticeSetup();
            Router.bindPracticeEvents();
            break;
          case 'intention_management':
            viewport.innerHTML = Router.renderStandaloneIntentionScreen();
            Router.bindStandaloneIntentionEvents();
            break;
          case 'scripture_standalone':
            viewport.innerHTML = Router.renderStandaloneScriptureScreen();
            Router.bindStandaloneScriptureEvents();
            break;
          case 'reflection_edit':
            viewport.innerHTML = Router.renderStandaloneReflectionScreen();
            Router.bindStandaloneReflectionEvents();
            break;
          case 'end_of_day':
            viewport.innerHTML = Router.renderEndOfDayView();
            Router.bindEndOfDayEvents();
            break;
          case 'history':
            viewport.innerHTML = Router.renderHistoryView();
            Router.loadHistoryData();
            break;
          case 'settings':
            viewport.innerHTML = Router.renderSettingsView();
            Router.bindSettingsEvents();
            break;
          case 'admin':
            viewport.innerHTML = Router.renderAdminView();
            Router.bindAdminEvents();
            break;
          case 'auth':
            viewport.innerHTML = Router.renderAuthView();
            Router.bindAuthEvents();
            break;
          default:
            viewport.innerHTML = `<div class="card"><p>Screen not found.</p><button class="btn btn-quiet" onclick="Router.navigate('today')">Return Today</button></div>`;
        }
      }

        const flowScripture = document.getElementById('flow-open-scripture');
        if (flowScripture) {
          flowScripture.addEventListener('click', () => {
            Router.fetchDailyReadingsInBackground();
            Router.navigate('scripture_standalone');
          });

        if (flowIntention) {

          });
        }

        if (reviewBtn) {
          reviewBtn.addEventListener('click', () => Router.navigate('end_of_day'));

        const setAnchorBtn = document.getElementById('btn-set-anchor-now');
        const editAnchorBtn = document.getElementById('btn-edit-anchor-inline');
        const clearAnchorBtn = document.getElementById('btn-clear-anchor-inline');

        const handleAnchorPrompt = () => {
          const currentText = (AppState.pocketAnchor && AppState.pocketAnchor.text) || '';
          const newText = prompt("Enter a single Scripture phrase to hold in mind today (Ruminatio):", currentText);
          if (newText !== null) {
            const trimmed = newText.trim();
            if (trimmed) {
              AppState.pocketAnchor = {
                text: trimmed,
                source: (AppState.readings[AppState.currentReadingIndex] ? AppState.readings[AppState.currentReadingIndex].title : "Today's Word"),
                date: new Date().toISOString().split('T')[0]
              };
              localStorage.setItem(STORAGE_KEY_POCKET_ANCHOR, JSON.stringify(AppState.pocketAnchor));
            } else {
              AppState.pocketAnchor = null;
              localStorage.removeItem(STORAGE_KEY_POCKET_ANCHOR);
            }
            Router.render();
          }
        };

        if (setAnchorBtn) setAnchorBtn.addEventListener('click', handleAnchorPrompt);
        if (editAnchorBtn) editAnchorBtn.addEventListener('click', handleAnchorPrompt);
        if (clearAnchorBtn) {
          clearAnchorBtn.addEventListener('click', () => {
            AppState.pocketAnchor = null;
            localStorage.removeItem(STORAGE_KEY_POCKET_ANCHOR);
            Router.render();
          });
        }
      }

      static bindStandaloneReflectionEvents() {
        const q1 = document.getElementById('standalone-q1');
        const q2 = document.getElementById('standalone-q2');
        const q3 = document.getElementById('standalone-q3');

        const handleAutoSave = () => {
          AppState.todayReflection.q1 = q1.value;
          AppState.todayReflection.q2 = q2.value;
          AppState.todayReflection.q3 = q3.value;
          localStorage.setItem(STORAGE_KEY_TODAY_REFLECTION, JSON.stringify(AppState.todayReflection));
          if (AppState.activeSession) {
            AppState.activeSession.reflections = { q1: q1.value, q2: q2.value, q3: q3.value };
            PracticeMachine.persistCurrentSession();
          }
        };

        if (q1) q1.addEventListener('input', handleAutoSave);
        if (q2) q2.addEventListener('input', handleAutoSave);
        if (q3) q3.addEventListener('input', handleAutoSave);

        const saveBtn = document.getElementById('btn-save-standalone-refl');
        if (saveBtn) {
          saveBtn.addEventListener('click', async () => {
            handleAutoSave();
            saveBtn.textContent = "Saving...";

            const currentReading = AppState.readings[AppState.currentReadingIndex] || AppState.readings[0];
            await ApiService.request('saveReflection', {
              reflection: {
                date: new Date().toISOString().split('T')[0],
                readingRef: currentReading ? currentReading.title : "Today's Reading",
                answers: {
                  q1: q1.value,
                  q2: q2.value,
                  q3: q3.value
                }
              }
            });

            saveBtn.textContent = "Save Reflection";
            ModalService.showAlert("Reflection updated successfully.", () => {
              Router.navigate('today');
            });
          });
        }

        const backBtn = document.getElementById('btn-refl-back');
        if (backBtn) backBtn.addEventListener('click', () => Router.navigate('today'));

        const cancelBtn = document.getElementById('btn-cancel-standalone-refl');
        if (cancelBtn) cancelBtn.addEventListener('click', () => Router.navigate('today'));
      }

      static renderPracticeFlow() {
        if (!AppState.activeSession) {
          return Router.renderPracticeSetup();
        }

        const state = AppState.activeSession.state;

        switch (state) {
          case PracticeStates.SCRIPTURE:
            return Router.renderScriptureScreen();
          case PracticeStates.REFLECTION:
            return Router.renderReflectionScreen();
          case PracticeStates.PRAYER_SERENITY:
            return Router.renderPrayerScreen("Stage 2 — Serenity Prayer", AppState.settings.serenityPrayer, false);
          case PracticeStates.PRAYER_PERSONAL:
            return Router.renderPrayerScreen("Stage 2 — Personal Prayer", AppState.settings.personalPrayer, false);
          case PracticeStates.PRAYER_JESUS:
            return Router.renderPrayerScreen("Stage 2 — Jesus Prayer", AppState.settings.jesusPrayer, true);
          case PracticeStates.MEDITATION_REVIEW:
            return Router.renderMeditationReviewScreen();
          case PracticeStates.INTENTION_SELECT:
            return Router.renderIntentionSelectScreen();
          case PracticeStates.CLOSING_SCREEN:
            return Router.renderClosingScreen();
          default:
            return `<div class="card"><p>Meditation is active...</p></div>`;
        }
      }
