<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OneDay — Personal Meditation Companion</title>
  
  <meta name="application-name" content="OneDay">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OneDay">
  <meta name="theme-color" content="#181716">
  <meta name="description" content="A calm, quiet personal companion for Scripture, Prayer, Meditation, and Daily Intention.">

  <!-- Embedded Web App Manifest via Data URI -->
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22OneDay%20Practice%22%2C%22short_name%22%3A%22OneDay%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23181716%22%2C%22theme_color%22%3A%22%23181716%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22apple-touch-icon.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    :root {
      --bg: #f8f6f2;
      --card-bg: #ffffff;
      --text-main: #2a2825;
      --text-muted: #736f69;
      --accent: #8c7355;
      --accent-soft: #f0eae1;
      --border: #e8e3dc;
      --timer-bg: #181716;
      --timer-text: #f0ede6;
      --timer-dim: #8c8881;
      --success: #526f58;
      --danger: #a2524f;
      --font-serif: "Iowan Old Style", "Apple Garamond", "Baskerville", "Times New Roman", "Droid Serif", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --radius: 12px;
      --trans: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="dark"] {
      --bg: #141312;
      --card-bg: #1c1b19;
      --text-main: #e8e5de;
      --text-muted: #969188;
      --accent: #c4a47c;
      --accent-soft: #282521;
      --border: #2e2c28;
      --timer-bg: #0c0b0b;
      --timer-text: #edeae2;
      --timer-dim: #6d6962;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    #app-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    header {
      padding: 16px 20px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      letter-spacing: 0.05em;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .user-profile-badge {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      cursor: pointer;
    }

    .user-profile-name {
      font-size: 0.72rem;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-top: -3px;
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 8px;
      font-size: 1.15rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover {
      color: var(--text-main);
      background: var(--accent-soft);
    }

    main {
      flex: 1;
      padding: 10px 18px 96px;
      display: flex;
      flex-direction: column;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
      word-break: break-word;
      overflow: hidden;
    }

    h2 {
      font-family: var(--font-serif);
      font-size: 1.45rem;
      font-weight: 500;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    h3 {
      font-family: var(--font-serif);
      font-size: 1.22rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    p {
      color: var(--text-muted);
      font-size: 0.96rem;
      margin-bottom: 14px;
    }

    /* Today Liturgical Date Banner */
    .today-date-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 4px 14px;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .today-date-banner .date-text {
      color: var(--text-main);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 18px;
      font-size: 0.98rem;
      font-weight: 500;
      border-radius: var(--radius);
      border: 1px solid transparent;
      cursor: pointer;
      transition: var(--trans);
      text-decoration: none;
      text-align: center;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--text-main);
      color: var(--bg);
    }

    .btn-primary:active {
      transform: scale(0.985);
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--accent-soft);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-quiet {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
      padding: 10px;
    }

    .btn-quiet:hover {
      color: var(--text-main);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 13px 15px;
      font-size: 0.98rem;
      font-family: inherit;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
      line-height: 1.6;
      font-family: var(--font-serif);
      font-size: 1.02rem;
    }

    /* Live Dual-Timer Stage Header */
    .stage-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      gap: 6px;
    }

    .stage-chip {
      font-size: 0.78rem;
      padding: 5px 10px;
      border-radius: 20px;
      background: var(--accent-soft);
      color: var(--text-main);
      font-weight: 500;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .stage-live-timer {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.84rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
      background: var(--card-bg);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .timer-stage-badge {
      color: var(--accent);
    }

    .timer-divider {
      color: var(--border);
      font-weight: normal;
    }

    .timer-total-badge {
      color: var(--text-muted);
      font-weight: 500;
    }

    .stage-exit-btn {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 0.84rem;
      cursor: pointer;
      font-weight: 500;
      padding: 6px 4px;
      white-space: nowrap;
    }

    .stage-back-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.84rem;
      cursor: pointer;
      font-weight: 500;
      padding: 6px 4px;
      white-space: nowrap;
    }

    .reading-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      -webkit-overflow-scrolling: touch;
    }

    .reading-tab-btn {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-muted);
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
      transition: var(--trans);
    }

    .reading-tab-btn.active {
      background: var(--text-main);
      color: var(--bg);
      border-color: var(--text-main);
    }

    .reading-tab-btn.patristic-tab {
      border-color: var(--accent);
      color: var(--accent);
    }

    .reading-tab-btn.patristic-tab.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .reading-top-toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin: 10px 0 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .reading-top-toolbar .btn-secondary {
      padding: 9px 14px;
      font-size: 0.88rem;
      border-radius: 20px;
      width: auto;
      flex: 1;
    }

    .reading-content-container {
      margin: 14px 0 24px;
      user-select: text;
      -webkit-user-select: text;
      line-height: 1.9;
    }

    .reading-citation {
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .reading-theme {
      font-family: var(--font-serif);
      font-size: 1.08rem;
      font-style: italic;
      color: var(--accent);
      margin-bottom: 18px;
      line-height: 1.65;
    }

    .reading-para {
      font-family: var(--font-serif);
      font-size: 1.08rem;
      line-height: 1.9;
      color: var(--text-main);
      margin-bottom: 1.5rem;
      letter-spacing: 0.01em;
    }

    .psalm-refrain-box {
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      padding: 12px 14px;
      border-radius: 0 var(--radius) var(--radius) 0;
      margin: 16px 0 18px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .psalm-refrain-symbol {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--accent);
      user-select: none;
    }

    .psalm-refrain-text {
      font-family: var(--font-serif);
      font-style: italic;
      color: var(--accent);
      line-height: 1.65;
      font-size: 1.02rem;
    }

    .psalm-stanza {
      font-family: var(--font-serif);
      font-size: 1.06rem;
      line-height: 1.85;
      color: var(--text-main);
      padding-left: 14px;
      border-left: 1.5px solid var(--border);
      margin-bottom: 1.4rem;
    }

    .reading-liturgical-conclusion {
      margin: 22px 0 10px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-family: var(--font-serif);
    }

    .versicle-call {
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .versicle-response {
      font-size: 1.02rem;
      font-style: italic;
      color: var(--accent);
    }

    /* Pocket Anchor Card */
    .pocket-anchor-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
      transition: var(--trans);
    }

    .pocket-anchor-badge {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .pocket-anchor-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      color: var(--accent);
    }

    .pocket-anchor-verse {
      font-family: var(--font-serif);
      font-size: 1.12rem;
      font-style: italic;
      line-height: 1.6;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .pocket-anchor-source {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: right;
    }

    .pocket-anchor-capture-box {
      background: var(--accent-soft);
      border: 1px dashed var(--accent);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin: 20px 0 16px;
    }

    .pocket-anchor-capture-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pocket-anchor-capture-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .pocket-anchor-capture-row input {
      flex: 1;
      padding: 9px 12px;
      font-size: 0.94rem;
    }

    .pocket-anchor-capture-row button {
      width: auto;
      padding: 0 14px;
      font-size: 0.86rem;
      white-space: nowrap;
    }

    .exegesis-box {
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      padding: 18px 20px;
      border-radius: 0 var(--radius) var(--radius) 0;
      margin: 18px 0;
      font-family: var(--font-serif);
      line-height: 1.78;
      color: var(--text-main);
      font-size: 1.02rem;
    }

    .exegesis-box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }

    .exegesis-box p {
      color: var(--text-main);
      margin-bottom: 12px;
      font-size: 1.01rem;
    }

    .exegesis-box ul {
      margin: 12px 0 16px 20px;
      list-style-type: disc;
    }

    .exegesis-box li {
      margin-bottom: 8px;
      line-height: 1.65;
    }

    .intention-creator-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
      width: 100%;
    }

    .intention-creator-row input {
      flex: 1;
      min-width: 0;
    }

    .intention-creator-row .btn-add {
      flex-shrink: 0;
      width: auto;
      padding: 0 20px;
      height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      border-radius: var(--radius);
      font-size: 0.95rem;
    }

    .intention-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card-bg);
      margin-bottom: 8px;
      cursor: pointer;
      transition: var(--trans);
    }

    .intention-item.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      font-weight: 500;
    }

    .intention-text-wrap {
      flex: 1;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .pill-group {
      display: flex;
      gap: 10px;
      margin: 16px 0;
    }

    .pill-btn {
      flex: 1;
      padding: 15px 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--trans);
      text-align: center;
    }

    .pill-btn.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .flow-list {
      list-style: none;
      margin: 16px 0;
    }

    .flow-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 6px;
      border-bottom: 1px solid var(--border);
      font-size: 0.98rem;
    }

    .flow-item.clickable-flow {
      cursor: pointer;
      border-radius: 8px;
      transition: var(--trans);
    }

    .flow-item.clickable-flow:hover {
      background: var(--accent-soft);
      padding-left: 10px;
      padding-right: 10px;
    }

    .stats-trio {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 18px 0;
    }

    .stat-card {
      background: var(--accent-soft);
      padding: 16px 8px;
      border-radius: var(--radius);
      text-align: center;
      border: 1px solid var(--border);
    }

    .stat-number {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 1.85rem;
      font-weight: 600;
      color: var(--accent);
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .stat-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stats-comparison-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
    }

    .comparison-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }

    .comparison-title {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .comparison-val {
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .comparison-sub {
      font-size: 0.8rem;
      font-weight: normal;
      color: var(--text-muted);
    }

    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 9px 0 calc(9px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      padding: 4px 10px;
      text-transform: uppercase;
      gap: 3px;
    }

    .nav-item.active {
      color: var(--text-main);
      font-weight: 600;
    }

    .nav-item span.icon {
      font-size: 1.25rem;
    }

    .timer-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--timer-bg);
      color: var(--timer-text);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 44px 24px calc(env(safe-area-inset-bottom, 24px) + 36px);
      text-align: center;
    }

    .timer-meta {
      margin-top: 18px;
    }

    .timer-stage-title {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--timer-dim);
    }

    .timer-substage {
      font-size: 1.08rem;
      margin-top: 6px;
      color: var(--accent);
    }

    .timer-digits {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Roboto", sans-serif;
      font-size: 5.6rem;
      font-weight: 200;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      color: var(--timer-text);
      margin: auto 0;
    }

    .timer-controls {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 12px;
    }

    .timer-btn-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn-timer {
      padding: 14px 10px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.08);

    /**

    class ModalService {
      static showConfirm(message, onConfirm, onCancel = null) {
        const modal = document.getElementById('custom-modal');
        const text = document.getElementById('modal-text');
        const confirmBtn = document.getElementById('modal-confirm-btn');
        const cancelBtn = document.getElementById('modal-cancel-btn');

        text.textContent = message;

          modal.classList.add('hidden');
          confirmBtn.onclick = null;
          cancelBtn.onclick = null;

        confirmBtn.onclick = () => {
          cleanUp();

        cancelBtn.onclick = () => {
          cleanUp();

        modal.classList.remove('hidden');

      static showAlert(message, onClose = null) {

    /**
     * Screen WakeLock Service
     */
    class WakeLockService {
      static sentinel = null;

      static async request() {
        if ('wakeLock' in navigator) {
          try {
            WakeLockService.sentinel = await navigator.wakeLock.request('screen');
            document.addEventListener('visibilitychange', WakeLockService.handleVisibility);
          } catch (e) {}
        }
      }

      static async release() {
        if (WakeLockService.sentinel) {
          try {
            await WakeLockService.sentinel.release();
            WakeLockService.sentinel = null;
          } catch (e) {}
        }
        document.removeEventListener('visibilitychange', WakeLockService.handleVisibility);
      }

      static async handleVisibility() {
        if (document.visibilityState === 'visible' && AppState.activeSession) {
          try {
            WakeLockService.sentinel = await navigator.wakeLock.request('screen');
          } catch (e) {}
        }
      }
    }

    /**
     * Audio & Speech Synthesis Service
     */
    class AudioService {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.isSpeaking = false;
        this.initVoiceEngine();
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      initVoiceEngine() {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.getVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
          window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }
      }

      findBestVoice() {
        if (!('speechSynthesis' in window)) return null;
        const voices = window.speechSynthesis.getVoices() || [];
        if (!voices.length) return null;

        const qualityKeywords = ['enhanced', 'premium', 'natural', 'neural', 'siri', 'daniel', 'serena', 'oliver', 'samantha'];
        for (const kw of qualityKeywords) {
          const matched = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes(kw));
          if (matched) return matched;
        }

        const calmEn = voices.find(v => v.lang === 'en-GB' || v.lang === 'en-ZA' || v.lang === 'en-IE' || v.lang === 'en-AU');
        if (calmEn) return calmEn;

        const anyEn = voices.find(v => v.lang.startsWith('en'));
        return anyEn || voices[0];
      }

      playGentleBell() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;

          const freqs = [432, 864, 1296];
          const now = this.ctx.currentTime;

          freqs.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);

            const initialGain = 0.22 / (idx + 1);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(initialGain, now + 0.08);
            gain.gain.exponentialRampToValueAtTime(0.00001, now + 3.4);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 3.5);
          });

          if ('vibrate' in navigator) navigator.vibrate([70, 40, 70]);
        } catch (e) {}
      }

      playMeditationClosingBells() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;

          const chimeTimes = [0, 1.2, 2.4];
          const chimeFreqs = [288, 432, 576];

          chimeTimes.forEach((delay, strikeIdx) => {
            const strikeStart = this.ctx.currentTime + delay;
            const baseFreq = chimeFreqs[strikeIdx];

            [baseFreq, baseFreq * 2].forEach((freq, harmonicIdx) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();

              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, strikeStart);

              const initialGain = 0.26 / (harmonicIdx + 1);
              gain.gain.setValueAtTime(0.0001, strikeStart);
              gain.gain.exponentialRampToValueAtTime(initialGain, strikeStart + 0.08);
              gain.gain.exponentialRampToValueAtTime(0.00001, strikeStart + 3.2);

              osc.connect(gain);
              gain.connect(this.ctx.destination);

              osc.start(strikeStart);
              osc.stop(strikeStart + 3.3);
            });
          });

          if ('vibrate' in navigator) navigator.vibrate([90, 80, 90, 80, 150]);
        } catch (e) {}
      }

      speak(text, onEndCallback = null) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();

        const cleanSpokenText = TextFormatter.sanitizeForSpeech(text);
        if (!cleanSpokenText) return;

        const utterance = new SpeechSynthesisUtterance(cleanSpokenText);
        utterance.rate = 0.88;
        utterance.pitch = 1.0;

        const bestVoice = this.findBestVoice();
        if (bestVoice) {
          utterance.voice = bestVoice;
          utterance.lang = bestVoice.lang;
        } else {
          utterance.lang = 'en-GB';
        }

        utterance.onend = () => {
          this.isSpeaking = false;
          if (onEndCallback) onEndCallback();
        };

        utterance.onerror = () => {
          this.isSpeaking = false;
          if (onEndCallback) onEndCallback();
        };

        this.isSpeaking = true;
        window.speechSynthesis.speak(utterance);
      }

      stopSpeech() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          this.isSpeaking = false;
        }
      }
    }

    const sound = new AudioService();

    /**
     * Liturgical & Typography Text Formatter
     */
    class TextFormatter {
      static decodeHtmlEntities(str) {
        if (!str) return '';
        const txt = document.createElement('textarea');
        txt.innerHTML = str;
        return txt.value;
      }

      static sanitizeForSpeech(raw, readingTitle = '') {
        if (!raw) return '';
        let s = TextFormatter.decodeHtmlEntities(raw);

        s = s.replace(/Gospel Acclamation[\s\S]*?(?=(?:A reading from|The beginning of|Gospel|Luke|Matthew|Mark|John|$))/i, ' ');
        s = s.replace(/Acclamation[\s\S]*?(?=(?:Luke|Matthew|Mark|John|$))/i, ' ');
        s = s.replace(/Alleluia[^\n.]*[\n.]/gi, ' ');
        s = s.replace(/How to listen[\s\S]*$/gi, ' ');

        // Eliminate "minus" from all verse and number ranges
        s = s.replace(/(\b[1-3]?\s?[A-Za-z]+)\s+(\d+)(?:\s*\(\d+\))?[:,\.]\s*(\d+)\s*(?:to|[\-–—])\s*(\d+)/gi, '$1 chapter $2, verses $3 to $4. ');
        s = s.replace(/(\b[1-3]?\s?[A-Za-z]+)\s+(\d+)(?:\s*\(\d+\))?[:,\.]\s*(\d+)/gi, '$1 chapter $2, verse $3. ');
        s = s.replace(/\bPsalm\s+(\d+)(?:\s*\(\d+\))?[:,\.]\s*(\d+)\s*(?:to|[\-–—])\s*(\d+)/gi, 'Psalm $1, verses $2 to $3. ');
        s = s.replace(/\bPsalm\s+(\d+)(?:\s*\(\d+\))?[:,\.]\s*(\d+)/gi, 'Psalm $1, verse $2. ');
        s = s.replace(/(\b\d+)\s*[\-–—]\s*(\d+\b)/g, '$1 to $2');

        s = s.replace(/#\d+;?/gi, ' ');
        s = s.replace(/&[a-z]+;?/gi, ' ');
        s = s.replace(/\(\d+[:\d\-,\s]*\)/g, ' ');
        s = s.replace(/\[\d+\]/g, ' ');
        s = s.replace(/<[^>]+>/g, ' ');

        let cleanSpoken = s.replace(/\s+/g, ' ').trim();

        // Catholic conclusions: EXCLUDE Patristic reading
        if (/gospel/i.test(readingTitle)) {
          cleanSpoken += ". The Gospel of the Lord. Praise to you, Lord Jesus Christ.";
        } else if (/first reading|second reading|^reading/i.test(readingTitle) && !/patristic/i.test(readingTitle)) {
          cleanSpoken += ". The word of the Lord. Thanks be to God.";
        }

        return cleanSpoken;
      }

      static formatReadingHtml(rawText, readingTitle = '') {
        if (!rawText) return '';
        
        let cleaned = TextFormatter.decodeHtmlEntities(rawText).trim();

        cleaned = cleaned.replace(/How to listen[\s\S]*?(?=\n\n|$)/gi, '');
        cleaned = cleaned.replace(/Get the official Universalis app[\s\S]*?(?=\n\n|$)/gi, '');
        cleaned = cleaned.replace(/You can read the Gospels in Greek[\s\S]*?(?=\n\n|$)/gi, '');
        cleaned = cleaned.replace(/The texts will be more readable[\s\S]*?(?=\n\n|$)/gi, '');
        cleaned = cleaned.replace(/Optional subscription:[\s\S]*?(?=\n\n|$)/gi, '');
        cleaned = cleaned.replace(/Christian Art[\s\S]*?(?=\n\n|$)/gi, '');

        cleaned = cleaned.replace(/Acclamation[\s\S]*?(?=(?:The Holy Gospel|Gospel\b(?!\s*Acclamation)|Luke|Matthew|Mark|John)\b)/i, '');
        cleaned = cleaned.replace(/^Gospel Acclamation[\s\S]*?(?=(?:A reading from|The beginning of|The Lord said|Jesus|In those days|Luke|Matthew|Mark|John|\n\n))/i, '');
        cleaned = cleaned.replace(/^(First Reading|Second Reading|Gospel|Responsorial Psalm|The Holy Gospel)\s*/i, '').trim();

        cleaned = cleaned.replace(/(\b\d+(?:\s*\(\d+\))?(?:[:,\-–—]\d+)*)(['"“‘]?\s*[A-Za-z])/g, '$1\n\n$2');

        const rawParagraphs = cleaned.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
        const paragraphs = [];

        rawParagraphs.forEach(p => {
          const citeMatch = p.match(/^([1-3]?\s?[A-Za-z]+|\bPsalm\b)\s+(\d+(?:\s*\(\d+\))?(?:[:,\-–—]\d+)*)(['"“‘]?\s*[\s\S]*)$/i);
          if (citeMatch && citeMatch[3] && citeMatch[3].trim().length > 0) {
            paragraphs.push(`${citeMatch[1]} ${citeMatch[2]}`.trim());
            paragraphs.push(citeMatch[3].trim());
          } else {
            paragraphs.push(p);
          }
        });

        let citationFound = false;
        let detectedRefrain = '';

        let bodyHtml = paragraphs.map((p, idx) => {
          if (!citationFound && idx === 0 && /^([1-3]?\s?[A-Za-z]+|\bPsalm\b)\s+\d+/i.test(p) && p.length < 80) {
            citationFound = true;
            return `<div class="reading-citation">${p}</div>`;
          }

          const isExplicitRefrain = /^(Response:|R\.|℟\.)/i.test(p);
          const isRefrainCandidate = (/^(Lord,|The Lord|My soul|Those who|Anyone who|Happy indeed|Blessed are|May the Lord|In every age|I rejoiced|You are my praise)/i.test(p) && p.length < 130);
          
          if (isExplicitRefrain || (isRefrainCandidate && (idx === 1 || !detectedRefrain || p === detectedRefrain))) {
            const cleanRefrainText = p.replace(/^(Response:|R\.|℟\.)\s*/i, '').trim();
            if (!detectedRefrain) detectedRefrain = cleanRefrainText;
            return `
              <div class="psalm-refrain-box">
                <span class="psalm-refrain-symbol">℟.</span>
                <span class="psalm-refrain-text">${cleanRefrainText}</span>
              </div>
            `;
          }

          if (/psalm/i.test(readingTitle) && p.length > 25) {
            return `<div class="psalm-stanza">${p.replace(/\n/g, '<br>')}</div>`;
          }

          if (citationFound && idx === 1 && p.length < 110 && !/^(The Lord|In those days|Jesus|Paul|Brothers|Hear the word|A reading|My vows)/i.test(p)) {
            return `<div class="reading-theme">${p}</div>`;
          }

          const withBreaks = p.replace(/\n/g, '<br>');
          return `<p class="reading-para">${withBreaks}</p>`;
        }).join('');

        // Catholic conclusions: EXCLUDE Patristic reading
        if (/gospel/i.test(readingTitle)) {
          bodyHtml += `
            <div class="reading-liturgical-conclusion">
              <div class="versicle-call">The Gospel of the Lord.</div>
              <div class="versicle-response">℟. Praise to you, Lord Jesus Christ.</div>
            </div>
          `;
        } else if (/first reading|second reading|^reading/i.test(readingTitle) && !/patristic/i.test(readingTitle)) {
          bodyHtml += `
            <div class="reading-liturgical-conclusion">
              <div class="versicle-call">The word of the Lord.</div>
              <div class="versicle-response">℟. Thanks be to God.</div>
            </div>
          `;
        } else if (/psalm/i.test(readingTitle) && detectedRefrain) {
          bodyHtml += `
            <div class="psalm-refrain-box" style="margin-top:20px;">
              <span class="psalm-refrain-symbol">℟.</span>
              <span class="psalm-refrain-text">${detectedRefrain}</span>
            </div>
          `;
        }

        return bodyHtml;
      }

      static formatExegesisHtml(rawText) {
        if (!rawText) return '';
        let text = TextFormatter.decodeHtmlEntities(rawText).trim();
        text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

        const lines = text.split('\n');
        let html = '';
        let inList = false;

        lines.forEach(line => {
          const trimmed = line.trim();
          if (!trimmed) {
            if (inList) { html += '</ul>'; inList = false; }
            return;
          }

          if (/^[-*•]\s+/.test(trimmed)) {
            if (!inList) { html += '<ul>'; inList = true; }
            html += `<li>${trimmed.replace(/^[-*•]\s+/, '')}</li>`;
          } else {
            if (inList) { html += '</ul>'; inList = false; }
            html += `<p>${trimmed}</p>`;
          }
        });

        if (inList) html += '</ul>';
        return html;
      }
    }

    /**
     * API Service

    class ApiService {
      static async request(action, payload = {}) {
        if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === "YOUR_APPS_SCRIPT_URL") {
          return { success: true, message: "Local mock mode" };
        }

        try {
          const body = {
            action: action,
            token: AppState.authToken,
            ...payload
          };

          const res = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'cors',
            redirect: 'follow',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(body)
          });

          if (!res.ok) throw new Error("HTTP " + res.status);
          return await res.json();
        } catch (err) {
          console.warn("API request failed:", err);
          return { success: false, error: err.toString() };
        }
      }
    }

    /**
     * Unified Timer & Practice Lifecycle Manager
     */
    class TimerService {
      static stageInterval = null;
      static totalInterval = null;
      static currentSeconds = 0;
      static totalSeconds = 0;
      static isCountUp = true;
      static isPaused = false;
      static targetEnd = 0;
      static startTimestamp = 0;
      static onStageComplete = null;

      static stopAll() {
        if (TimerService.stageInterval) {
          clearInterval(TimerService.stageInterval);
          TimerService.stageInterval = null;
        }
        if (TimerService.totalInterval) {
          clearInterval(TimerService.totalInterval);
          TimerService.totalInterval = null;
        }
      }

      static startSessionClocks(isCountUp, durationMinutes, onComplete) {
        TimerService.stopAll();
        TimerService.isCountUp = isCountUp;
        TimerService.isPaused = false;
        TimerService.onStageComplete = onComplete;
        TimerService.startTimestamp = Date.now();

        if (isCountUp) {
          TimerService.currentSeconds = 0;
        } else {
          TimerService.currentSeconds = durationMinutes * 60;
          TimerService.targetEnd = Date.now() + (durationMinutes * 60 * 1000);
        }

        TimerService.stageInterval = setInterval(() => {
          if (TimerService.isPaused) return;

          const now = Date.now();
          if (TimerService.isCountUp) {
            TimerService.currentSeconds = Math.floor((now - TimerService.startTimestamp) / 1000);
          } else {
            const leftMs = TimerService.targetEnd - now;
            TimerService.currentSeconds = Math.max(0, Math.ceil(leftMs / 1000));
            if (TimerService.currentSeconds <= 0) {
              TimerService.stopAll();
              if (TimerService.onStageComplete) TimerService.onStageComplete();
              return;
            }
          }
          TimerService.updateUI();
        }, 500);

        TimerService.updateUI();
      }

      static updateUI() {
        const formatTime = (secs) => {
          const m = Math.floor(secs / 60);
          const s = secs % 60;
          return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        };

        const stageClock = document.getElementById('stage-timer-clock');
        const countdownClock = document.getElementById('stage-countdown-clock');
        const jesusCountdownEl = document.getElementById('jesus-countdown');
        const totalClock = document.getElementById('session-total-clock');
        const fullscreenDisplay = document.getElementById('timer-display');

        if (stageClock) stageClock.textContent = formatTime(TimerService.currentSeconds);
        if (countdownClock) countdownClock.textContent = formatTime(TimerService.currentSeconds);
        if (jesusCountdownEl) jesusCountdownEl.textContent = formatTime(TimerService.currentSeconds);
        if (fullscreenDisplay) fullscreenDisplay.textContent = formatTime(TimerService.currentSeconds);

        if (totalClock && AppState.activeSession) {
          const totalSecs = Math.floor((Date.now() - AppState.activeSession.startTimestamp) / 1000);
          totalClock.textContent = formatTime(totalSecs);
        }
      }
    }

          }
        };

      static enterMeditationStage(stageName, subStageName, durationMinutes, onEndCallback) {
        const overlay = document.getElementById('timer-overlay');
        const stageTitleEl = document.getElementById('timer-stage-name');
        const subTitleEl = document.getElementById('timer-substage-name');
        const pauseBtn = document.getElementById('timer-pause-btn');

        stageTitleEl.textContent = stageName;
        subTitleEl.textContent = subStageName;
        pauseBtn.textContent = 'Pause';
        overlay.classList.remove('hidden');

        sound.playGentleBell();

        TimerService.startSessionClocks(false, durationMinutes, () => {
          overlay.classList.add('hidden');
          if (onEndCallback) onEndCallback();
        });

        const extendBtn = document.getElementById('timer-extend-btn');
        const reduceBtn = document.getElementById('timer-reduce-btn');
        const skipBtn = document.getElementById('timer-skip-btn');
        const endBtn = document.getElementById('timer-end-btn');

        pauseBtn.onclick = () => {
          TimerService.isPaused = !TimerService.isPaused;
          pauseBtn.textContent = TimerService.isPaused ? 'Resume' : 'Pause';
          if (!TimerService.isPaused) {
            TimerService.targetEnd = Date.now() + (TimerService.currentSeconds * 1000);
          }
        };

        extendBtn.onclick = () => {
          TimerService.currentSeconds += 120;
          TimerService.targetEnd += 120000;
          TimerService.updateUI();
        };

        reduceBtn.onclick = () => {
          if (TimerService.currentSeconds > 130) {
            TimerService.currentSeconds -= 120;
            TimerService.targetEnd -= 120000;
            TimerService.updateUI();
          }
        };

        skipBtn.onclick = () => {
          TimerService.stopAll();
          overlay.classList.add('hidden');
          if (onEndCallback) onEndCallback();
        };

        endBtn.onclick = () => {
          ModalService.showConfirm("End your meditation practice now?", () => {
            TimerService.stopAll();
            overlay.classList.add('hidden');
            PracticeManager.finishPracticeEarly();
          });
        };
      }

      static finishPracticeEarly() {
        TimerService.stopAll();
        WakeLockService.release();
        document.getElementById('timer-overlay').classList.add('hidden');
        Router.navigate('practice_summary');
      }

      static finishPracticeComplete() {
        TimerService.stopAll();
        WakeLockService.release();
        document.getElementById('timer-overlay').classList.add('hidden');
        sound.playMeditationClosingBells();
        Router.navigate('stage4_intention');
      }
    }

    class ExegesisManager {
      static async requestForReading(reading) {
        const dateKey = `${AppState.todayStr}_${reading.id}`;
        if (AppState.exegesisCache[dateKey]) return;

        AppState.pendingExegesis[dateKey] = true;
        Router.updateExegesisButtonState(reading.id, true);

        try {
          const res = await ApiService.request('getExegesis', {
            readingTitle: reading.title,
            readingText: reading.content,
            dateKey: dateKey
          });

          if (res && res.success && res.exegesis) {
            AppState.exegesisCache[dateKey] = res.exegesis;
            localStorage.setItem(STORAGE_KEY_EXEGESIS_CACHE, JSON.stringify(AppState.exegesisCache));
          }
        } catch (e) {
          console.warn("Exegesis error:", e);
        } finally {
          delete AppState.pendingExegesis[dateKey];
          Router.refreshExegesisContainer(reading.id);
        }
      }
    }

      static renderHistoryView() {
        return `
          <div class="card">
            <h2>Practice History</h2>
            <p>Your journey of stillness and contemplative presence.</p>

            <div id="history-content">
              <p style="text-align: center; color: var(--text-muted); padding: 24px;">Loading practice statistics...</p>
            </div>
          </div>
        `;
      }

      static async bindHistoryEvents() {
        const container = document.getElementById('history-content');
        if (!container) return;

        if (!AppState.authToken) {
          container.innerHTML = `
            <div style="text-align: center; padding: 20px 0;">
              <p style="margin-bottom: 16px;">Log in to view your complete practice history, streaks, and statistics.</p>
              <button class="btn btn-primary" onclick="Router.navigate('settings')">Log In to Account</button>
            </div>
          `;
          return;
        }

        try {
          const res = await ApiService.request('getUserHistory');

          if (!res || !res.success || !res.history) {
            const errMsg = (res && res.error) ? res.error : 'Unable to retrieve history records from server.';
            const isAuthIssue = /unauthorized|expired|token|not found/i.test(errMsg);

            container.innerHTML = `
              <div style="padding: 16px 0; text-align: center;">
                <p style="color: var(--danger); font-size: 0.94rem; margin-bottom: 14px;">
                  ${errMsg}
                </p>
                <div style="display: flex; gap: 8px; justify-content: center;">
                  <button class="btn btn-secondary" style="width: auto; padding: 8px 16px;" onclick="Router.navigate('history')">↻ Try Again</button>
                  ${isAuthIssue ? `<button class="btn btn-primary" style="width: auto; padding: 8px 16px;" onclick="Router.navigate('settings')">Log In Again</button>` : ''}
                </div>
              </div>
            `;
            return;
          }

          const h = res.history;
          const recentSessions = Array.isArray(h.recentSessions) ? h.recentSessions : [];

          // Compute week and month minutes directly from recent sessions for guaranteed accuracy
          const now = new Date();
          const dow = (now.getDay() + 6) % 7; // Monday = 0, Sunday = 6
          const startOfThisWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow);
          startOfThisWeek.setHours(0, 0, 0, 0);

          const startOfLastWeek = new Date(startOfThisWeek);
          startOfLastWeek.setDate(startOfLastWeek.getDate() - 7);

          const endOfLastWeek = new Date(startOfThisWeek);
          endOfLastWeek.setMilliseconds(-1);

          const thisMonthPrefix = AppState.todayStr.slice(0, 7);
          const lastMonthDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
          const lastMonthPrefix = `${lastMonthDate.getFullYear()}-${String(lastMonthDate.getMonth() + 1).padStart(2, '0')}`;

          let clientThisWeek = 0;
          let clientLastWeek = 0;
          let clientThisMonth = 0;
          let clientLastMonth = 0;

          recentSessions.forEach(s => {
            const dur = Number(s.duration) || 0;
            const sDate = new Date(s.date + 'T12:00:00');
            if (!isNaN(sDate.getTime())) {
              if (sDate >= startOfThisWeek) {
                clientThisWeek += dur;
              } else if (sDate >= startOfLastWeek && sDate <= endOfLastWeek) {
                clientLastWeek += dur;
              }
            }

            if (typeof s.date === 'string') {
              if (s.date.startsWith(thisMonthPrefix)) {
                clientThisMonth += dur;
              } else if (s.date.startsWith(lastMonthPrefix)) {
                clientLastMonth += dur;
              }
            }
          });

          const serverThisWeek = (h.thisWeek && typeof h.thisWeek.minutes === 'number') ? h.thisWeek.minutes : 0;
          const serverLastWeek = (h.thisWeek && typeof h.thisWeek.previousMinutes === 'number') ? h.thisWeek.previousMinutes : 0;
          const thisWeekMins = clientThisWeek || serverThisWeek;
          const prevWeekMins = clientLastWeek || serverLastWeek;
          const weekDiff = thisWeekMins - prevWeekMins;

          const serverThisMonth = (h.thisMonth && typeof h.thisMonth.minutes === 'number') ? h.thisMonth.minutes : 0;
          const serverLastMonth = (h.thisMonth && typeof h.thisMonth.previousMinutes === 'number') ? h.thisMonth.previousMinutes : 0;
          const thisMonthMins = clientThisMonth || serverThisMonth;
          const prevMonthMins = clientLastMonth || serverLastMonth;
          const monthDiff = thisMonthMins - prevMonthMins;

          const legacy = h.legacy || { practices: 0, minutes: 0, streak: 0, lastDate: '' };

          container.innerHTML = `
            <div class="stats-trio">
              <div class="stat-card">
                <div class="stat-number">${h.currentStreak || 0}</div>
                <div class="stat-title">Daily Streak</div>
              </div>
              <div class="stat-card">
                <div class="stat-number">${h.totalPractices || 0}</div>
                <div class="stat-title">Days Still</div>
              </div>
              <div class="stat-card">
                <div class="stat-number">${h.totalMinutes || 0}</div>
                <div class="stat-title">Minutes</div>
              </div>
            </div>

            <div class="stats-comparison-row">
              <div class="comparison-card">
                <div class="comparison-title">This Week vs Last</div>
                <div class="comparison-val">
                  ${thisWeekMins}m 
                  <span class="comparison-sub">(${weekDiff >= 0 ? '+' : ''}${weekDiff}m)</span>
                </div>
              </div>
              <div class="comparison-card">
                <div class="comparison-title">This Month vs Last</div>
                <div class="comparison-val">
                  ${thisMonthMins}m 
                  <span class="comparison-sub">(${monthDiff >= 0 ? '+' : ''}${monthDiff}m)</span>
                </div>
              </div>
            </div>

            <div class="pocket-anchor-card" style="margin: 18px 0;">
              <div class="pocket-anchor-badge">
                <span class="pocket-anchor-label">Carry Over Past Practice (Hallow)</span>
                <button class="btn-quiet" id="btn-edit-legacy" style="padding: 2px 6px; font-size: 0.76rem; color: var(--accent);">Update Stats</button>
              </div>
              <p style="font-size: 0.88rem; margin-bottom: 0;">
                Seeded with ${legacy.practices} sessions, ${legacy.minutes} min, and ${legacy.streak}-day streak.
              </p>
            </div>

            <h3 style="margin-top: 22px;">Recent Sittings</h3>
            <div style="margin-top: 10px;">
              ${recentSessions.length > 0 ? recentSessions.map(s => `
                <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.92rem;">
                  <span>${s.date}</span>
                  <span style="color: var(--accent); font-weight: 500;">${s.duration} min</span>
                </div>
              `).join('') : '<p style="color: var(--text-muted); font-size: 0.9rem;">No sessions recorded yet.</p>'}
            </div>
          `;

          const legacyBtn = document.getElementById('btn-edit-legacy');
          if (legacyBtn) {
            legacyBtn.addEventListener('click', () => {
              const practices = prompt("Total historical practice sessions (from Hallow):", legacy.practices || 0);
              if (practices === null) return;
              const minutes = prompt("Total historical minutes silent (from Hallow):", legacy.minutes || 0);
              if (minutes === null) return;
              const streak = prompt("Current streak count from Hallow:", legacy.streak || 0);
              if (streak === null) return;
              const lastDate = prompt("Date of last completed Hallow session (YYYY-MM-DD):", legacy.lastDate || "");
              if (lastDate === null) return;

              ApiService.request('setLegacyStats', {
                legacy: {
                  practices: practices,
                  minutes: minutes,
                  streak: streak,
                  lastDate: lastDate
                }
              }).then(() => Router.navigate('history'));
            });
          }
        } catch (clientErr) {
          container.innerHTML = `
            <div style="padding: 16px 0; text-align: center;">
              <p style="color: var(--danger); font-size: 0.92rem; margin-bottom: 12px;">
                Client display error: ${clientErr.message || clientErr}
              </p>
              <button class="btn btn-secondary" style="width: auto; padding: 8px 16px;" onclick="Router.navigate('history')">↻ Retry</button>
            </div>
          `;
        }
      }

      // ---------------------------------------------------------
      // VIEW: SETTINGS & ACCOUNT & TIMER DEFAULTS
      // ---------------------------------------------------------
      static renderSettingsView() {
        return `
          <div class="card">
            <h2>Settings & Preferences</h2>

            ${AppState.currentUser ? `
              <p>Logged in as <strong>${AppState.currentUser.name}</strong> (${AppState.currentUser.email})</p>
              <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:18px;">Role: ${AppState.currentUser.role}</p>
            ` : `
              <p>Log in to save your practice history across devices.</p>
              <form id="login-form" style="margin-bottom: 24px;">
                <div class="input-group">
                  <label>Email Address</label>
                  <input type="email" id="login-email" placeholder="name@domain.com" required autocomplete="username">
                </div>
                <div class="input-group">
                  <label>Password</label>
                  <input type="password" id="login-password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" id="btn-submit-login">Log In</button>
              </form>
            `}

            <div style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 18px;">
              <h3>Default Sitting Durations (Minutes)</h3>
              <p style="font-size:0.88rem;">Set your standard meditation times:</p>

              <div class="input-group">
                <label>Scripture & Reflection</label>
                <input type="number" id="pref-scrip-dur" value="${AppState.settings.scriptureDuration || 4}" min="1" max="30">
              </div>

              <div class="input-group">
                <label>Jesus Prayer (Countdown)</label>
                <input type="number" id="pref-jesus-dur" value="${AppState.settings.jesusPrayerDuration || 1}" min="1" max="10">
              </div>

              <div class="input-group">
                <label>Stage 3.1 Focused Attention</label>
                <input type="number" id="pref-focused-dur" value="${AppState.settings.focusedDuration || 10}" min="1" max="60">
              </div>

              <div class="input-group">
                <label>Stage 3.2 Open Awareness</label>
                <input type="number" id="pref-open-dur" value="${AppState.settings.openDuration || 20}" min="1" max="60">
              </div>

              <button class="btn btn-secondary" id="btn-save-durations">Save Default Durations</button>
            </div>

            <div style="margin-top: 24px; border-top: 1px solid var(--border); padding-top: 18px;">
              <h3>Contemplative Resources</h3>
              <p style="font-size:0.88rem; margin-bottom: 12px;">Permanent spiritual reading and weekly commentary:</p>
              <div style="display: flex; flex-direction: column; gap: 8px;">
                <a href="https://www.youtube.com/@BishopBarron/videos" target="_blank" rel="noopener" class="btn btn-secondary" style="text-align: left; justify-content: space-between; font-size: 0.92rem; padding: 11px 14px;">
                  <span>Bishop Barron • Word on Fire</span>
                  <span>↗</span>
                </a>
                <a href="https://universalis.com/africa.safrica/mass.htm" target="_blank" rel="noopener" class="btn btn-secondary" style="text-align: left; justify-content: space-between; font-size: 0.92rem; padding: 11px 14px;">
                  <span>Universalis Liturgical Source</span>
                  <span>↗</span>
                </a>
              </div>
            </div>

            ${AppState.currentUser ? `
              <div style="margin-top: 24px; border-top: 1px solid var(--border); padding-top: 18px;">
                <h3>Change Password</h3>
                <div class="input-group">
                  <label>Current Password</label>
                  <input type="password" id="chg-old-pass">
                </div>
                <div class="input-group">
                  <label>New Password (min 8 chars)</label>
                  <input type="password" id="chg-new-pass">
                </div>
                <button class="btn btn-secondary" id="btn-submit-chgpass">Update Password</button>
              </div>

              <div class="btn-group" style="margin-top: 24px;">
                <button class="btn btn-quiet" id="btn-logout" style="color: var(--danger);">Log Out</button>
                <button class="btn btn-secondary" onclick="Router.navigate('today')">Back to Today</button>
              </div>
            ` : ''}
          </div>
        `;
      }

      static bindSettingsEvents() {
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('btn-submit-login');

        const handleLoginSubmit = async (e) => {
          if (e) e.preventDefault();
          const emailInput = document.getElementById('login-email');
          const passInput = document.getElementById('login-password');
          if (!emailInput || !passInput) return;

          const email = emailInput.value.trim();
          const pass = passInput.value;
          if (!email || !pass) {
            ModalService.showAlert("Please enter your email and password.");
            return;
          }

          if (loginBtn) {
            loginBtn.textContent = 'Logging in...';
            loginBtn.disabled = true;
          }

          const res = await ApiService.request('login', { email: email, password: pass });
          if (res && res.success) {
            AppState.currentUser = res.user;
            AppState.authToken = res.token;
            localStorage.setItem(STORAGE_KEY_AUTH, JSON.stringify({ user: res.user, token: res.token }));
            Router.updateHeaderProfileBadge();
            SyncService.pullDailyState();
            Router.navigate('today');
          } else {
            ModalService.showAlert(res.error || "Login failed. Please check your credentials.");
            if (loginBtn) {
              loginBtn.textContent = 'Log In';
              loginBtn.disabled = false;
            }
          }
        };

        if (loginForm) loginForm.addEventListener('submit', handleLoginSubmit);

        const saveDurBtn = document.getElementById('btn-save-durations');
        if (saveDurBtn) {
          saveDurBtn.addEventListener('click', () => {
            const scrip = parseInt(document.getElementById('pref-scrip-dur').value, 10) || 4;
            const jesus = parseInt(document.getElementById('pref-jesus-dur').value, 10) || 1;
            const focused = parseInt(document.getElementById('pref-focused-dur').value, 10) || 10;
            const open = parseInt(document.getElementById('pref-open-dur').value, 10) || 20;

            AppState.settings.scriptureDuration = scrip;
            AppState.settings.jesusPrayerDuration = jesus;
            AppState.settings.focusedDuration = focused;
            AppState.settings.openDuration = open;

            const durationsToSave = { scripture: scrip, jesus: jesus, focused: focused, open: open };
            localStorage.setItem(STORAGE_KEY_DURATIONS, JSON.stringify(durationsToSave));

            ModalService.showAlert("Default sitting durations updated.");
          });
        }

        const logoutBtn = document.getElementById('btn-logout');
        if (logoutBtn) {
          logoutBtn.addEventListener('click', () => {
            AppState.currentUser = null;
            AppState.authToken = null;
            localStorage.removeItem(STORAGE_KEY_AUTH);
            Router.updateHeaderProfileBadge();
            Router.navigate('today');
          });
        }

        const chgPassBtn = document.getElementById('btn-submit-chgpass');
        if (chgPassBtn) {
          chgPassBtn.addEventListener('click', async () => {
            const oldPass = document.getElementById('chg-old-pass').value;
            const newPass = document.getElementById('chg-new-pass').value;
            if (!newPass || newPass.length < 8) {
              ModalService.showAlert("New password must be at least 8 characters.");
              return;
            }

            chgPassBtn.textContent = 'Updating...';
            const res = await ApiService.request('changePassword', { oldPassword: oldPass, newPassword: newPass });
            if (res.success) {
              ModalService.showAlert("Password updated successfully.");
              document.getElementById('chg-old-pass').value = '';
              document.getElementById('chg-new-pass').value = '';
            } else {
              ModalService.showAlert(res.error || "Failed to update password.");
            }
            chgPassBtn.textContent = 'Update Password';
          });
        }
      }

      // ---------------------------------------------------------
      // VIEW: ADMIN
      // ---------------------------------------------------------
      static renderAdminView() {
        return `
          <div class="card">
            <h2>Administrator Portal</h2>
            <p>Database management and user provisioning.</p>
            <div id="admin-user-list">
              <p>Loading users...</p>
            </div>
            <button class="btn btn-secondary" style="margin-top: 18px;" onclick="Router.navigate('today')">Return Today</button>
          </div>
        `;
      }

      static async bindAdminEvents() {
        const res = await ApiService.request('adminGetUsers');
        const container = document.getElementById('admin-user-list');
        if (!container) return;

        if (res && res.success && res.users) {
          container.innerHTML = `
            <div style="margin-top: 10px;">
              ${res.users.map(u => `
                <div style="padding: 10px 0; border-bottom: 1px solid var(--border);">
                  <div style="font-weight: 600;">${u.name} (${u.role})</div>
                  <div style="font-size: 0.85rem; color: var(--text-muted);">${u.email} • ${u.active ? 'Active' : 'Inactive'}</div>
                </div>
              `).join('')}
            </div>
          `;
        } else {
          container.innerHTML = `<p>Admin access only.</p>`;
        }
      }
    }

    /**
     * Application Bootstrapping
     */
    window.addEventListener('DOMContentLoaded', () => {
      const savedAuth = localStorage.getItem(STORAGE_KEY_AUTH);
      if (savedAuth) {
        try {
          const parsed = JSON.parse(savedAuth);
          AppState.currentUser = parsed.user;
          AppState.authToken = parsed.token;
        } catch (e) {}
      }

      const savedDurations = localStorage.getItem(STORAGE_KEY_DURATIONS);
      if (savedDurations) {
        try {
          const d = JSON.parse(savedDurations);
          if (d.scripture) AppState.settings.scriptureDuration = d.scripture;
          if (d.jesus) AppState.settings.jesusPrayerDuration = d.jesus;
          if (d.focused) AppState.settings.focusedDuration = d.focused;
          if (d.open) AppState.settings.openDuration = d.open;
        } catch (e) {}
      }

      const savedAnchor = localStorage.getItem(STORAGE_KEY_POCKET_ANCHOR);
      if (savedAnchor) {
        try { AppState.pocketAnchor = JSON.parse(savedAnchor); } catch (e) {}
      }

      const savedCustomIntentions = localStorage.getItem(STORAGE_KEY_CUSTOM_INTENTIONS);
      if (savedCustomIntentions) {
        try { AppState.customIntentions = JSON.parse(savedCustomIntentions); } catch (e) {}
      }

      const savedReflection = localStorage.getItem(STORAGE_KEY_TODAY_REFLECTION);
      if (savedReflection) {
        try { AppState.todayReflection = JSON.parse(savedReflection); } catch (e) {}
      }

      const savedExegesis = localStorage.getItem(STORAGE_KEY_EXEGESIS_CACHE);
      if (savedExegesis) {
        try { AppState.exegesisCache = JSON.parse(savedExegesis); } catch (e) {}
      }

      Router.init();
    });
  </script>
</body>
</html>
