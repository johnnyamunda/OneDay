<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OneDay — Personal Meditation Companion</title>
  
  <meta name="application-name" content="OneDay">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OneDay">
  <meta name="theme-color" content="#181716">
  <meta name="description" content="A calm, quiet personal companion for Scripture, Prayer, Meditation, and Daily Intention.">

  <!-- Embedded Web App Manifest via Data URI -->
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22OneDay%20Practice%22%2C%22short_name%22%3A%22OneDay%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23181716%22%2C%22theme_color%22%3A%22%23181716%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Ccircle%20cx%3D'50'%20cy%3D'50'%20r%3D'40'%20fill%3D'%23c4a47c'%2F%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">

  <style>
    :root {
      --bg: #f8f6f2;
      --card-bg: #ffffff;
      --text-main: #2a2825;
      --text-muted: #736f69;
      --accent: #8c7355;
      --accent-soft: #f0eae1;
      --border: #e8e3dc;
      --timer-bg: #181716;
      --timer-text: #f0ede6;
      --timer-dim: #79756f;
      --success: #526f58;
      --danger: #a2524f;
      --font-serif: "Iowan Old Style", "Apple Garamond", "Baskerville", "Times New Roman", "Droid Serif", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --radius: 12px;
      --trans: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="dark"] {
      --bg: #141312;
      --card-bg: #1c1b19;
      --text-main: #e8e5de;
      --text-muted: #969188;
      --accent: #c4a47c;
      --accent-soft: #282521;
      --border: #2e2c28;
      --timer-bg: #0c0b0b;
      --timer-text: #edeae2;
      --timer-dim: #5c5852;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    #app-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    header {
      padding: 16px 20px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      letter-spacing: 0.05em;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title:hover {
      opacity: 0.85;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .user-profile-badge {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      cursor: pointer;
    }

    .user-profile-name {
      font-size: 0.72rem;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-top: -3px;
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 8px;
      font-size: 1.15rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover {
      color: var(--text-main);
      background: var(--accent-soft);
    }

    main {
      flex: 1;
      padding: 10px 18px 96px;
      display: flex;
      flex-direction: column;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    h2 {
      font-family: var(--font-serif);
      font-size: 1.45rem;
      font-weight: 500;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    h3 {
      font-family: var(--font-serif);
      font-size: 1.18rem;
      font-weight: 500;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    p {
      color: var(--text-muted);
      font-size: 0.96rem;
      margin-bottom: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 15px 18px;
      font-size: 0.98rem;
      font-weight: 500;
      border-radius: var(--radius);
      border: 1px solid transparent;
      cursor: pointer;
      transition: var(--trans);
      text-decoration: none;
      text-align: center;
    }

    .btn-primary {
      background: var(--text-main);
      color: var(--bg);
    }

    .btn-primary:active {
      transform: scale(0.985);
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--accent-soft);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:active {
      background: var(--border);
    }

    .btn-quiet {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
      padding: 10px;
    }

    .btn-quiet:hover {
      color: var(--text-main);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 13px 15px;
      font-size: 0.98rem;
      font-family: inherit;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
      line-height: 1.6;
      font-family: var(--font-serif);
      font-size: 1.02rem;
    }

    .stage-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .stage-chip {
      font-size: 0.78rem;
      padding: 5px 12px;
      border-radius: 20px;
      background: var(--accent-soft);
      color: var(--text-main);
      font-weight: 500;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .stage-live-timer {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.92rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      background: var(--card-bg);
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .stage-exit-btn {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
      padding: 6px 8px;
    }

    .reading-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      -webkit-overflow-scrolling: touch;
    }

    .reading-tab-btn {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-muted);
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
      transition: var(--trans);
    }

    .reading-tab-btn.active {
      background: var(--text-main);
      color: var(--bg);
      border-color: var(--text-main);
    }

    .reading-content-container {
      margin: 16px 0 24px;
      user-select: text;
      -webkit-user-select: text;
    }

    .reading-para {
      font-family: var(--font-serif);
      font-size: 1.08rem;
      line-height: 1.82;
      color: var(--text-main);
      margin-bottom: 1.15rem;
      letter-spacing: 0.01em;
    }

    .reading-para:last-child {
      margin-bottom: 0;
    }

    .reading-rubric {
      font-family: var(--font-sans);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .reading-response {
      font-family: var(--font-serif);
      font-style: italic;
      color: var(--accent);
      padding-left: 12px;
      border-left: 2px solid var(--accent);
      margin: 12px 0 16px;
      line-height: 1.7;
    }

    /* Structured, readable Exegesis formatting */
    .exegesis-box {
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      padding: 18px 20px;
      border-radius: 0 var(--radius) var(--radius) 0;
      margin: 16px 0;
      font-family: var(--font-serif);
      line-height: 1.7;
      color: var(--text-main);
      font-size: 1rem;
    }

    .exegesis-box p {
      color: var(--text-main);
      margin-bottom: 12px;
      font-size: 1.01rem;
    }

    .exegesis-box p:last-child {
      margin-bottom: 0;
    }

    .exegesis-box ul {
      margin: 10px 0 14px 22px;
      list-style-type: disc;
    }

    .exegesis-box li {
      margin-bottom: 6px;
      line-height: 1.55;
    }

    .exegesis-box strong {
      color: var(--text-main);
      font-weight: 600;
    }

    /* Intention Drag and Drop Items */
    .intention-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card-bg);
      margin-bottom: 8px;
      cursor: pointer;
      transition: var(--trans);
    }

    .intention-item.dragging {
      opacity: 0.45;
      background: var(--accent-soft);
      border: 1px dashed var(--accent);
    }

    .intention-item.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      font-weight: 500;
    }

    .intention-drag-handle {
      color: var(--text-muted);
      cursor: grab;
      font-size: 1.1rem;
      padding: 0 4px;
      touch-action: none;
    }

    .intention-text-wrap {
      flex: 1;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .intention-actions {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .btn-item-action {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 4px 6px;
      border-radius: 4px;
    }

    .btn-item-action:hover {
      color: var(--text-main);
      background: rgba(0, 0, 0, 0.05);
    }

    .pill-group {
      display: flex;
      gap: 10px;
      margin: 16px 0;
    }

    .pill-btn {
      flex: 1;
      padding: 15px 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--trans);
      text-align: center;
    }

    .pill-btn.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .flow-list {
      list-style: none;
      margin: 16px 0;
    }

    .flow-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 6px;
      border-bottom: 1px solid var(--border);
      font-size: 0.98rem;
    }

    .flow-item.clickable-flow {
      cursor: pointer;
      border-radius: 8px;
      transition: var(--trans);
    }

    .flow-item.clickable-flow:hover {
      background: var(--accent-soft);
      padding-left: 10px;
      padding-right: 10px;
    }

    .flow-item:last-child {
      border-bottom: none;
    }

    .flow-indicator {
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    .flow-indicator.done {
      color: var(--success);
      font-weight: bold;
    }

    .stats-trio {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 18px 0;
    }

    .stat-card {
      background: var(--accent-soft);
      padding: 16px 10px;
      border-radius: var(--radius);
      text-align: center;
      border: 1px solid var(--border);
    }

    .stat-number {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 1.85rem;
      font-weight: 600;
      color: var(--accent);
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .stat-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 600;
    }

    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 9px 0 calc(9px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      padding: 4px 10px;
      text-transform: uppercase;
      gap: 3px;
    }

    .nav-item.active {
      color: var(--text-main);
      font-weight: 600;
    }

    .nav-item span.icon {
      font-size: 1.25rem;
    }

    .timer-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--timer-bg);
      color: var(--timer-text);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 44px 24px env(safe-area-inset-bottom, 28px);
      text-align: center;
    }

    .timer-meta {
      margin-top: 16px;
    }

    .timer-stage-title {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--timer-dim);
    }

    .timer-substage {
      font-size: 1.05rem;
      margin-top: 4px;
      color: var(--accent);
    }

    .timer-digits {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Roboto", sans-serif;
      font-size: 5.4rem;
      font-weight: 200;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      color: var(--timer-text);
      margin: auto 0;
    }

    .timer-controls {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .timer-btn-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn-timer {
      padding: 14px 10px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--timer-text);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.94rem;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }

    .btn-timer:active {
      background: rgba(255, 255, 255, 0.18);
    }

    .btn-timer-primary {
      background: var(--timer-text);
      color: var(--timer-bg);
      font-weight: 500;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(3px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: var(--card-bg);
      color: var(--text-main);
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    .modal-message {
      font-size: 1.05rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .status-banner {
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 20px;
      background: var(--accent-soft);
      color: var(--text-muted);
      display: inline-block;
      margin-bottom: 12px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="app-container">
    
    <header id="main-header">
      <div class="brand-title" id="brand-home-link" title="Return to Today">
        <span>OneDay</span>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="btn-icon" title="Toggle Calm Display" aria-label="Toggle display theme">◐</button>
        <div class="user-profile-badge" id="auth-btn" title="Account settings">
          <button class="btn-icon" style="padding: 4px;" aria-label="Account status">👤</button>
          <span class="user-profile-name" id="header-user-name"></span>
        </div>
      </div>
    </header>

    <main id="app-viewport">
      <!-- Dynamically rendered via Router -->
    </main>

    <nav class="bottom-nav" id="bottom-nav">
      <button class="nav-item active" data-route="today">
        <span class="icon">☼</span>
        Today
      </button>
      <button class="nav-item" data-route="practice">
        <span class="icon">◌</span>
        Practice
      </button>
      <button class="nav-item" data-route="history">
        <span class="icon">▤</span>
        History
      </button>
      <button class="nav-item" data-route="settings">
        <span class="icon">⚙</span>
        Settings
      </button>
      <button class="nav-item hidden" id="admin-nav-btn" data-route="admin">
        <span class="icon">⚡</span>
        Admin
      </button>
    </nav>

    <!-- Fullscreen Silent Meditation Timer (Stage 3.1 & 3.2) -->
    <div id="timer-overlay" class="timer-screen hidden">
      <div class="timer-meta">
        <div class="timer-stage-title" id="timer-stage-name">Stage 3.1</div>
        <div class="timer-substage" id="timer-substage-name">Focused Attention</div>
      </div>

      <div class="timer-digits" id="timer-display">10:00</div>

      <div class="timer-controls">
        <div class="timer-btn-row">
          <button class="btn-timer" id="timer-reduce-btn">-2 min</button>
          <button class="btn-timer" id="timer-pause-btn">Pause</button>
          <button class="btn-timer" id="timer-extend-btn">+2 min</button>
          <button class="btn-timer" id="timer-skip-btn">Next</button>
        </div>
        <button class="btn-timer btn-timer-primary" id="timer-end-btn">End Practice Early</button>
      </div>
    </div>

    <!-- Calm In-App Confirmation / Message Modal -->
    <div id="custom-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-message" id="modal-text">Are you sure?</div>
        <div class="btn-group" id="modal-btn-group">
          <button class="btn btn-primary" id="modal-confirm-btn">Confirm</button>
          <button class="btn btn-quiet" id="modal-cancel-btn">Cancel</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMo9vVnhvqi3EQq3eCF0S8TrrAg0Rb1IMLMbXG5m6EfrnMTkOy0JQ7BqiiTa0RoQOD/exec";
    const STORAGE_KEY_AUTH = "oneday_auth_session";
    const STORAGE_KEY_PRACTICE = "oneday_active_practice";
    const STORAGE_KEY_SETTINGS = "oneday_cached_settings";
    const STORAGE_KEY_LAST_INTENTION = "oneday_last_chosen_intention";
    const STORAGE_KEY_TODAY_REFLECTION = "oneday_today_reflection";
    const STORAGE_KEY_EXEGESIS_CACHE = "oneday_exegesis_cache";

    // Application Master State
    const AppState = {
      currentUser: null,
      authToken: null,
      currentRoute: 'today',
      isOnline: navigator.onLine,

    /**
     * Modal Service
     */
    class ModalService {
      static showConfirm(message, onConfirm, onCancel = null) {
        const modal = document.getElementById('custom-modal');
        const text = document.getElementById('modal-text');
        const confirmBtn = document.getElementById('modal-confirm-btn');
        const cancelBtn = document.getElementById('modal-cancel-btn');

        text.textContent = message;
        cancelBtn.classList.remove('hidden');
        confirmBtn.textContent = "Confirm";

        const cleanUp = () => {
          modal.classList.add('hidden');
          confirmBtn.onclick = null;
          cancelBtn.onclick = null;
        };

        confirmBtn.onclick = () => {
          cleanUp();
          if (onConfirm) onConfirm();
        };

        cancelBtn.onclick = () => {
          cleanUp();
          if (onCancel) onCancel();
        };

        modal.classList.remove('hidden');
      }

      static showAlert(message, onClose = null) {
        const modal = document.getElementById('custom-modal');
        const text = document.getElementById('modal-text');
        const confirmBtn = document.getElementById('modal-confirm-btn');
        const cancelBtn = document.getElementById('modal-cancel-btn');

        text.textContent = message;
        cancelBtn.classList.add('hidden');
        confirmBtn.textContent = "OK";

        confirmBtn.onclick = () => {
          modal.classList.add('hidden');
          confirmBtn.onclick = null;
          if (onClose) onClose();
        };

        modal.classList.remove('hidden');
      }
    }

    /**
     * Web Audio singing bowl and speech synthesizer
     */
    class AudioService {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.isSpeaking = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playGentleBell() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;

          const freqs = [432, 864, 1296];
          const now = this.ctx.currentTime;

          freqs.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);

            const initialGain = 0.22 / (idx + 1);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(initialGain, now + 0.08);
            gain.gain.exponentialRampToValueAtTime(0.00001, now + 3.4);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 3.5);
          });

          if ('vibrate' in navigator) {
            navigator.vibrate([70, 40, 70]);
          }
        } catch (e) {
          console.warn("Audio chime could not play:", e);
        }
      }

      /**
       * Distinct ending bell for Open Awareness / Meditation completion:
       * Three soft resonant harmonics echoing gently (warm Tibetan temple close).
       */
      playMeditationClosingBells() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;

          const chimeTimes = [0, 1.2, 2.4];
          const chimeFreqs = [288, 432, 576];

          chimeTimes.forEach((delay, strikeIdx) => {
            const strikeStart = this.ctx.currentTime + delay;
            const baseFreq = chimeFreqs[strikeIdx];

            [baseFreq, baseFreq * 2].forEach((freq, harmonicIdx) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();

              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, strikeStart);

              const initialGain = 0.26 / (harmonicIdx + 1);
              gain.gain.setValueAtTime(0.0001, strikeStart);
              gain.gain.exponentialRampToValueAtTime(initialGain, strikeStart + 0.08);
              gain.gain.exponentialRampToValueAtTime(0.00001, strikeStart + 3.2);

              osc.connect(gain);
              gain.connect(this.ctx.destination);

              osc.start(strikeStart);
              osc.stop(strikeStart + 3.3);
            });
          });

          if ('vibrate' in navigator) {
            navigator.vibrate([90, 80, 90, 80, 150]);
          }
        } catch (e) {
          console.warn("Closing bell chime could not play:", e);
        }
      }

      speak(text, onEndCallback = null) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.88;
        utterance.pitch = 1.0;
        
        utterance.onend = () => {
          this.isSpeaking = false;
          if (onEndCallback) onEndCallback();
        };

        utterance.onerror = () => {
          this.isSpeaking = false;
          if (onEndCallback) onEndCallback();
        };

        this.isSpeaking = true;
        window.speechSynthesis.speak(utterance);
      }

      stopSpeech() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          this.isSpeaking = false;
        }
      }
    }

    /**
     * Text formatting helper for clear liturgical paragraphing & clean Exegesis
     */
    class TextFormatter {
      static formatReadingHtml(rawText) {
        if (!rawText) return '';
        
        const cleaned = rawText.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
        const paragraphs = cleaned.split(/\n\s*\n/);

        return paragraphs.map(p => {
          const trimmed = p.trim();
          if (!trimmed) return '';

          if (/^Response:/i.test(trimmed) || /^R\./i.test(trimmed)) {
            return `<div class="reading-response">${trimmed}</div>`;
          }

          if (/^(A reading from|Psalm\s+\d+|The beginning of|Gospel)/i.test(trimmed) && trimmed.length < 90) {
            return `<div class="reading-rubric">${trimmed}</div>`;
          }

          const withBreaks = trimmed.replace(/\n/g, '<br>');
          return `<p class="reading-para">${withBreaks}</p>`;
        }).join('');
      }

      /**
       * Clean up AI Exegesis markdown (removes raw **, parses bullets into readable lists)
       */
      static formatExegesisHtml(rawText) {
        if (!rawText) return '';

        let text = rawText.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();

        // Convert markdown bold **text** to <strong>text</strong>
        text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        text = text.replace(/###?\s+(.*)/g, '<div style="font-weight:600; font-size:1.05rem; margin:12px 0 6px; color:var(--text-main);">$1</div>');

        const lines = text.split('\n');
        let html = '';
        let inList = false;

        lines.forEach(line => {
          const trimmed = line.trim();
          if (!trimmed) {
            if (inList) {
              html += '</ul>';
              inList = false;
            }
            return;
          }

          // Check if bullet item
          if (/^[-*•]\s+/.test(trimmed)) {
            if (!inList) {
              html += '<ul>';
              inList = true;
            }
            const itemText = trimmed.replace(/^[-*•]\s+/, '');
            html += `<li>${itemText}</li>`;
          } else {
            if (inList) {
              html += '</ul>';
              inList = false;
            }
            if (!/^<div/i.test(trimmed)) {
              html += `<p>${trimmed}</p>`;
            } else {
              html += trimmed;
            }
          }
        });

        if (inList) html += '</ul>';
        return html;
      }
    }

    /**
     * API service with backend integration
     */
    class ApiService {
      static async request(action, payload = {}) {
        if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === "YOUR_APPS_SCRIPT_URL") {
          return ApiService.mockResponse(action, payload);
        }

        try {
          const body = {
            action: action,
            token: AppState.authToken,
            ...payload
          };

          const res = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'cors',
            redirect: 'follow',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(body)
          });

          if (!res.ok) throw new Error("HTTP status " + res.status);
          const data = await res.json();
          return data;
        } catch (err) {
          console.warn("API request fallback to local mode:", err);
          return ApiService.mockResponse(action, payload);
        }
      }

      static mockResponse(action, payload) {
        return new Promise((resolve) => {
          setTimeout(() => {
            if (action === 'login') {
              if (payload.password === 'wrong') {
                resolve({ success: false, error: "Incorrect password" });
              } else {
                resolve({
                  success: true,
                  token: "mock_token_" + Date.now(),
                  user: {
                    userId: "usr_mock",
                    name: (payload.email ? payload.email.split('@')[0] : "Johnny"),
                    email: payload.email || "user@oneday.app",
                    role: (payload.email && payload.email.includes('admin')) ? 'admin' : 'client'
                  }
                });
              }
            } else if (action === 'getAppSettings') {
              resolve({ success: true, settings: AppState.settings });
            } else if (action === 'getReadings') {
              resolve({ success: true, readings: AppState.readings });
            } else if (action === 'getTodayReflection') {
              resolve({ success: true, reflection: null });
            } else if (action === 'getExegesis') {

    /**
     * Finite state machine stages and practice machine
     */
    const PracticeStates = {
      IDLE: 'IDLE',
      SCRIPTURE: 'SCRIPTURE',
      REFLECTION: 'REFLECTION',
      PRAYER_SERENITY: 'PRAYER_SERENITY',
      PRAYER_PERSONAL: 'PRAYER_PERSONAL',
      PRAYER_JESUS: 'PRAYER_JESUS',
      FOCUSED_MEDITATION: 'FOCUSED_MEDITATION',
      OPEN_MONITORING: 'OPEN_MONITORING',
      MEDITATION_REVIEW: 'MEDITATION_REVIEW',
      INTENTION_SELECT: 'INTENTION_SELECT',
      CLOSING_SCREEN: 'CLOSING_SCREEN'
    };

    class PracticeMachine {
      static startSession(customDurations = {}) {
        sound.init();
        wakeLock.request();

        // Non-blocking background fetch of readings (does NOT stall screen entry)
        ApiService.request('getReadings').then(readingRes => {
          if (readingRes && readingRes.success && Array.isArray(readingRes.readings) && readingRes.readings.length > 0) {
            AppState.readings = readingRes.readings;
            // If currently on Scripture screen, update quietly
            if (AppState.activeSession && AppState.activeSession.state === PracticeStates.SCRIPTURE) {
              Router.render();
            }
          }
        }).catch(e => console.warn("Using offline liturgical readings."));

        // Persist default chosen intention
        let initialIntention = AppState.lastChosenIntention;
        if (!initialIntention && AppState.settings.predefinedIntentions.length > 0) {
          initialIntention = AppState.settings.predefinedIntentions[0].text;
        }

        const currentRefl = {
          q1: AppState.todayReflection.q1 || '',
          q2: AppState.todayReflection.q2 || '',
          q3: AppState.todayReflection.q3 || ''
        };

        AppState.activeSession = {
          sessionId: 'sess_' + Date.now(),
          startTimestamp: Date.now(),
          date: new Date().toISOString().split('T')[0],
          startTime: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          durations: {
            scripture: customDurations.scripture || AppState.settings.scriptureDuration,
            reflection: customDurations.reflection || AppState.settings.reflectionDuration,
            prayer: customDurations.prayer || AppState.settings.prayerDuration,
            focused: customDurations.focused || AppState.settings.focusedDuration,
            open: customDurations.open || AppState.settings.openDuration
          },
          reflections: currentRefl,
          experience: 'Fine',
          experienceNote: '',
          selectedIntention: initialIntention || '',
          state: PracticeStates.SCRIPTURE,
          completedStages: []
        };

        PracticeMachine.persistCurrentSession();
        Router.navigate('practice');
        PracticeMachine.startActiveStageTimer();
      }

      static persistCurrentSession() {
        if (AppState.activeSession) {
          localStorage.setItem(STORAGE_KEY_PRACTICE, JSON.stringify(AppState.activeSession));
        } else {
          localStorage.removeItem(STORAGE_KEY_PRACTICE);
        }
      }

      static restoreSession() {
        const stored = localStorage.getItem(STORAGE_KEY_PRACTICE);
        if (stored) {
          try {
            AppState.activeSession = JSON.parse(stored);
            return true;
          } catch (e) {
            localStorage.removeItem(STORAGE_KEY_PRACTICE);
          }
        }
        return false;
      }

      static stopTimer() {
        if (AppState.timer.intervalId) {
          clearInterval(AppState.timer.intervalId);
          AppState.timer.intervalId = null;
        }
        AppState.timer.targetTimestamp = null;
        AppState.timer.startTimestamp = null;
        AppState.timer.elapsedSeconds = 0;
        AppState.timer.remainingSeconds = 0;
        AppState.timer.isPaused = false;
        AppState.timer.isCountUp = false;
      }

      /**
       * Starts timer:
       * Scripture, Reflection, and Prayer COUNT UP (no auto-advance, peaceful unhurried pace).
       * Focused Attention & Open Monitoring are fullscreen countdown timers.
       */
      static startActiveStageTimer() {
        PracticeMachine.stopTimer();
        if (!AppState.activeSession) return;

        const current = AppState.activeSession.state;

        // Stages 1 & 2: COUNT UP timers. User advances whenever ready.
        if (current === PracticeStates.SCRIPTURE || 
            current === PracticeStates.REFLECTION || 
            current === PracticeStates.PRAYER_SERENITY || 
            current === PracticeStates.PRAYER_PERSONAL || 
            current === PracticeStates.PRAYER_JESUS) {
          
          AppState.timer.isCountUp = true;
          AppState.timer.elapsedSeconds = 0;
          AppState.timer.startTimestamp = Date.now();
          AppState.timer.isPaused = false;

          PracticeMachine.updateStageLiveTimerDisplay();

          AppState.timer.intervalId = setInterval(() => {
            if (!AppState.timer.isPaused && AppState.timer.startTimestamp) {
              const now = Date.now();
              AppState.timer.elapsedSeconds = Math.floor((now - AppState.timer.startTimestamp) / 1000);
              PracticeMachine.updateStageLiveTimerDisplay();
            }
          }, 1000);
          return;
        }

        // Stage 3: Fullscreen countdown timers
        if (current === PracticeStates.FOCUSED_MEDITATION) {
          PracticeMachine.launchFullscreenTimer(AppState.activeSession.durations.focused * 60, "Stage 3.1", "Focused Attention", false);
          return;
        } else if (current === PracticeStates.OPEN_MONITORING) {
          PracticeMachine.launchFullscreenTimer(AppState.activeSession.durations.open * 60, "Stage 3.2", "Open Monitoring", true);
          return;
        }
      }

      static updateStageLiveTimerDisplay() {
        const el = document.getElementById('stage-timer-clock');
        if (el) {
          const totalSecs = AppState.timer.elapsedSeconds || 0;
          const mins = Math.floor(totalSecs / 60);
          const secs = totalSecs % 60;
          el.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }
      }

      static advanceState(manual = true) {
        if (!AppState.activeSession) return;
        PracticeMachine.stopTimer();
        sound.stopSpeech();

        const current = AppState.activeSession.state;
        if (!AppState.activeSession.completedStages.includes(current)) {
          AppState.activeSession.completedStages.push(current);
        }

        switch (current) {
          case PracticeStates.SCRIPTURE:
            AppState.activeSession.state = PracticeStates.REFLECTION;
            break;
          case PracticeStates.REFLECTION:
            AppState.activeSession.state = PracticeStates.PRAYER_SERENITY;
            break;
          case PracticeStates.PRAYER_SERENITY:
            AppState.activeSession.state = PracticeStates.PRAYER_PERSONAL;
            break;
          case PracticeStates.PRAYER_PERSONAL:
            AppState.activeSession.state = PracticeStates.PRAYER_JESUS;
            break;
          case PracticeStates.PRAYER_JESUS:
            AppState.activeSession.state = PracticeStates.FOCUSED_MEDITATION;
            break;
          case PracticeStates.FOCUSED_MEDITATION:
            AppState.activeSession.state = PracticeStates.OPEN_MONITORING;
            break;
          case PracticeStates.OPEN_MONITORING:
            wakeLock.release();
            AppState.activeSession.state = PracticeStates.MEDITATION_REVIEW;
            break;
          case PracticeStates.MEDITATION_REVIEW:
            AppState.activeSession.state = PracticeStates.INTENTION_SELECT;
            break;
          case PracticeStates.INTENTION_SELECT:
            if (AppState.activeSession.selectedIntention) {
              AppState.lastChosenIntention = AppState.activeSession.selectedIntention;
              localStorage.setItem(STORAGE_KEY_LAST_INTENTION, AppState.lastChosenIntention);
            }
            AppState.activeSession.state = PracticeStates.CLOSING_SCREEN;
            PracticeMachine.persistCompletedSession();
            break;
          case PracticeStates.CLOSING_SCREEN:
            AppState.activeSession = null;
            PracticeMachine.persistCurrentSession();
            Router.navigate('today');
            return;
          default:
            AppState.activeSession.state = PracticeStates.IDLE;
        }

        PracticeMachine.persistCurrentSession();
        Router.render();
        PracticeMachine.startActiveStageTimer();
      }

      static launchFullscreenTimer(durationSeconds, stageName, substageName, isOpenAwareness = false) {
        PracticeMachine.stopTimer();

        const overlay = document.getElementById('timer-overlay');
        const stageEl = document.getElementById('timer-stage-name');
        const substageEl = document.getElementById('timer-substage-name');
        const displayEl = document.getElementById('timer-display');
        const pauseBtn = document.getElementById('timer-pause-btn');

        stageEl.textContent = stageName;
        substageEl.textContent = substageName;
        overlay.classList.remove('hidden');

        AppState.timer.isCountUp = false;
        AppState.timer.remainingSeconds = durationSeconds;
        AppState.timer.isPaused = false;
        AppState.timer.targetTimestamp = Date.now() + durationSeconds * 1000;
        pauseBtn.textContent = "Pause";

        const updateDisplay = () => {
          const mins = Math.floor(AppState.timer.remainingSeconds / 60);
          const secs = AppState.timer.remainingSeconds % 60;
          displayEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        };

        updateDisplay();
        sound.playGentleBell();

        AppState.timer.intervalId = setInterval(() => {
          if (!AppState.timer.isPaused && AppState.timer.targetTimestamp) {
            const now = Date.now();
            const diff = Math.max(0, Math.round((AppState.timer.targetTimestamp - now) / 1000));
            AppState.timer.remainingSeconds = diff;
            updateDisplay();

            if (diff <= 0) {
              PracticeMachine.stopTimer();
              overlay.classList.add('hidden');

              // At end of Open Awareness, play the distinct 3-stroke temple chime
              if (isOpenAwareness) {
                sound.playMeditationClosingBells();
              } else {
                sound.playGentleBell();
              }

              // Auto-advance Focused Attention directly to Open Monitoring
              PracticeMachine.advanceState(false);
            }
          }
        }, 500);
      }

      static togglePause() {
        const pauseBtn = document.getElementById('timer-pause-btn');
        if (AppState.timer.isPaused) {
          AppState.timer.isPaused = false;
          AppState.timer.targetTimestamp = Date.now() + AppState.timer.remainingSeconds * 1000;
          if (pauseBtn) pauseBtn.textContent = "Pause";
        } else {
          AppState.timer.isPaused = true;
          if (pauseBtn) pauseBtn.textContent = "Resume";
        }
      }

      static extendTimer(extraSeconds = 120) {
        AppState.timer.remainingSeconds += extraSeconds;
        if (AppState.timer.targetTimestamp) {
          AppState.timer.targetTimestamp += extraSeconds * 1000;
        }
        const mins = Math.floor(AppState.timer.remainingSeconds / 60);
        const secs = AppState.timer.remainingSeconds % 60;
        document.getElementById('timer-display').textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      static reduceTimer(subSeconds = 120) {
        AppState.timer.remainingSeconds = Math.max(60, AppState.timer.remainingSeconds - subSeconds);
        if (AppState.timer.targetTimestamp) {
          AppState.timer.targetTimestamp = Date.now() + AppState.timer.remainingSeconds * 1000;
        }
        const mins = Math.floor(AppState.timer.remainingSeconds / 60);
        const secs = AppState.timer.remainingSeconds % 60;
        document.getElementById('timer-display').textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      static skipStage() {
        PracticeMachine.stopTimer();
        document.getElementById('timer-overlay').classList.add('hidden');
        PracticeMachine.advanceState(true);
      }

      static endPracticeEarly() {
        ModalService.showConfirm("End today's practice session early and proceed to closing?", () => {
          PracticeMachine.stopTimer();
          sound.stopSpeech();
          wakeLock.release();
          document.getElementById('timer-overlay').classList.add('hidden');

          if (AppState.activeSession) {
            AppState.activeSession.endedEarly = true;
            if (AppState.activeSession.selectedIntention) {
              AppState.lastChosenIntention = AppState.activeSession.selectedIntention;
              localStorage.setItem(STORAGE_KEY_LAST_INTENTION, AppState.lastChosenIntention);
            }
            AppState.activeSession.state = PracticeStates.CLOSING_SCREEN;
            PracticeMachine.persistCompletedSession();
            Router.render();
          }
        });
      }

      static async persistCompletedSession() {
        wakeLock.release();

        if (AppState.activeSession) {
          const now = Date.now();
          const elapsedMins = Math.max(1, Math.round((now - (AppState.activeSession.startTimestamp || now)) / 60000));
          AppState.activeSession.endTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          AppState.activeSession.durationMinutes = elapsedMins;
          AppState.activeSession.status = AppState.activeSession.endedEarly ? 'interrupted' : 'completed';

          ApiService.request('savePracticeSession', { session: AppState.activeSession });
          if (AppState.activeSession.reflections) {
            const todayReading = AppState.readings[AppState.currentReadingIndex] || AppState.readings[0];
            ApiService.request('saveReflection', {
              reflection: {
                sessionId: AppState.activeSession.sessionId,
                date: AppState.activeSession.date,
                readingRef: todayReading ? todayReading.title : "Today's Reading",
                answers: AppState.activeSession.reflections
              }
            });
          }

          localStorage.removeItem(STORAGE_KEY_PRACTICE);
        }
      }
    }

    /**
     * Application Router and View Rendering
     */
    class Router {
      static init() {
        document.querySelectorAll('nav.bottom-nav button').forEach(btn => {
          btn.addEventListener('click', () => {
            const route = btn.dataset.route;
            Router.navigate(route);

        });

        // Click OneDay in Header to return home
        const brandLink = document.getElementById('brand-home-link');
        if (brandLink) {
          brandLink.addEventListener('click', () => Router.navigate('today'));

        document.getElementById('timer-pause-btn').addEventListener('click', () => PracticeMachine.togglePause());
        document.getElementById('timer-extend-btn').addEventListener('click', () => PracticeMachine.extendTimer(120));
        document.getElementById('timer-reduce-btn').addEventListener('click', () => PracticeMachine.reduceTimer(120));

        document.getElementById('timer-end-btn').addEventListener('click', () => PracticeMachine.endPracticeEarly());

        // Theme Toggle
        document.getElementById('theme-toggle').addEventListener('click', () => {
          const current = document.documentElement.getAttribute('data-theme');
          const next = current === 'dark' ? 'light' : 'dark';

          localStorage.setItem('oneday_theme', next);

        document.getElementById('auth-btn').addEventListener('click', () => {
          Router.navigate('auth');

        if (PracticeMachine.restoreSession()) {

      static updateHeaderProfileBadge() {
        const nameEl = document.getElementById('header-user-name');
        if (nameEl) {

      static async syncTodayReflectionFromBackend() {
        if (!AppState.authToken) return;
        const res = await ApiService.request('getTodayReflection', {
          dateKey: new Date().toISOString().split('T')[0]
        });
        if (res.success && res.reflection && res.reflection.answers) {
          AppState.todayReflection.q1 = res.reflection.answers.q1 || AppState.todayReflection.q1;
          AppState.todayReflection.q2 = res.reflection.answers.q2 || AppState.todayReflection.q2;
          AppState.todayReflection.q3 = res.reflection.answers.q3 || AppState.todayReflection.q3;
          AppState.todayReflection.readingRef = res.reflection.readingRef || AppState.todayReflection.readingRef;
          localStorage.setItem(STORAGE_KEY_TODAY_REFLECTION, JSON.stringify(AppState.todayReflection));
        }

      static navigate(route) {
        if (route !== 'practice' && AppState.timer.intervalId) {
          PracticeMachine.stopTimer();
        }

        AppState.currentRoute = route;

        document.querySelectorAll('nav.bottom-nav button').forEach(b => {
          b.classList.toggle('active', b.dataset.route === route);
        });

        const adminBtn = document.getElementById('admin-nav-btn');
        if (AppState.currentUser && AppState.currentUser.role === 'admin') {
          adminBtn.classList.remove('hidden');
        } else {
          adminBtn.classList.add('hidden');
        }

        Router.updateHeaderProfileBadge();
        Router.render();

      static render() {
        const viewport = document.getElementById('app-viewport');
        sound.stopSpeech();

        switch (AppState.currentRoute) {

            viewport.innerHTML = Router.renderTodayView();
            Router.bindTodayEvents();

          case 'practice':
          case 'practice_setup':
            viewport.innerHTML = Router.renderPracticeFlow();
            Router.bindPracticeEvents();
            break;
          case 'scripture_standalone':
            viewport.innerHTML = Router.renderStandaloneScriptureScreen();
            Router.bindStandaloneScriptureEvents();
            break;
          case 'reflection_edit':
            viewport.innerHTML = Router.renderStandaloneReflectionScreen();
            Router.bindStandaloneReflectionEvents();
            break;
          case 'end_of_day':
            viewport.innerHTML = Router.renderEndOfDayView();
            Router.bindEndOfDayEvents();
            break;
          case 'history':
            viewport.innerHTML = Router.renderHistoryView();
            Router.loadHistoryData();
            break;

            viewport.innerHTML = Router.renderSettingsView();
            Router.bindSettingsEvents();
            break;

            Router.bindAdminEvents();
            break;

            Router.bindAuthEvents();

        const state = AppState.activeSession.state;

        switch (state) {
          case PracticeStates.SCRIPTURE:
            return Router.renderScriptureScreen();
          case PracticeStates.REFLECTION:
            return Router.renderReflectionScreen();
          case PracticeStates.PRAYER_SERENITY:
            return Router.renderPrayerScreen("Stage 2 — Serenity Prayer", AppState.settings.serenityPrayer);
          case PracticeStates.PRAYER_PERSONAL:
            return Router.renderPrayerScreen("Stage 2 — Personal Prayer", AppState.settings.personalPrayer);
          case PracticeStates.PRAYER_JESUS:
            return Router.renderPrayerScreen("Stage 2 — Jesus Prayer", AppState.settings.jesusPrayer);
          case PracticeStates.MEDITATION_REVIEW:
            return Router.renderMeditationReviewScreen();
          case PracticeStates.INTENTION_SELECT:
            return Router.renderIntentionSelectScreen();
          case PracticeStates.CLOSING_SCREEN:
            return Router.renderClosingScreen();
          default:
            return `<div class="card"><p>Meditation is active...</p></div>`;
        }
      }

      static bindPracticeEvents() {
        const exitBtns = document.querySelectorAll('#btn-stage-exit');
        exitBtns.forEach(b => {
          b.addEventListener('click', () => PracticeMachine.endPracticeEarly());
        });

        // Single-tap Enter Practice fix
        const confirmStart = document.getElementById('btn-confirm-start');
        if (confirmStart) {
          confirmStart.addEventListener('click', () => {
            const fo = parseInt(document.getElementById('setup-dur-focused').value, 10) || 10;
            const op = parseInt(document.getElementById('setup-dur-open').value, 10) || 20;

            PracticeMachine.startSession({ focused: fo, open: op });
          });
        }

        // Reading Tab Switcher
        document.querySelectorAll('.reading-tab-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            AppState.currentReadingIndex = parseInt(e.target.dataset.idx, 10);
            Router.render();
          });
        });

        const speakBtn = document.getElementById('btn-read-aloud');
        if (speakBtn) {
          speakBtn.addEventListener('click', () => {
            if (sound.isSpeaking) {
              sound.stopSpeech();
              speakBtn.textContent = '🔊 Read Back';
            } else {
              const current = AppState.readings[AppState.currentReadingIndex];
              const textToRead = `${current.title}. ${current.content}`;
              speakBtn.textContent = '⏹ Stop Read Back';
              sound.speak(textToRead, () => {
                const btnRef = document.getElementById('btn-read-aloud');
                if (btnRef) btnRef.textContent = '🔊 Read Back';
              });
            }
          });
        }

        const uniBtn = document.getElementById('btn-open-universalis');
        if (uniBtn) {
          uniBtn.addEventListener('click', () => {
            window.open(AppState.settings.universalisUrl || "https://universalis.com/africa.safrica/mass.htm", "_blank");
          });
        }

        // AI Exegesis with Cache Check & Clean Formatting
        const exegesisBtn = document.getElementById('btn-generate-exegesis');
        if (exegesisBtn) {
          exegesisBtn.addEventListener('click', async () => {
            const currentReading = AppState.readings[AppState.currentReadingIndex];
            const box = document.getElementById('exegesis-container');
            
            // 1. Check local cache first
            if (AppState.exegesisCache[currentReading.id]) {
              box.innerHTML = `
                <div class="exegesis-box">
                  <div style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); margin-bottom: 8px;">
                    Context & Commentary — ${currentReading.title}
                  </div>
                  <div>${TextFormatter.formatExegesisHtml(AppState.exegesisCache[currentReading.id])}</div>
                </div>
              `;
              return;
            }

            box.innerHTML = `<p style="font-style: italic; color: var(--accent);">Preparing exegesis for ${currentReading.title}...</p>`;
            
            const res = await ApiService.request('getExegesis', {
              readingTitle: currentReading.title,
              readingText: currentReading.content
            });

            if (res.success && res.exegesis) {
              AppState.exegesisCache[currentReading.id] = res.exegesis;
              localStorage.setItem(STORAGE_KEY_EXEGESIS_CACHE, JSON.stringify(AppState.exegesisCache));

              box.innerHTML = `
                <div class="exegesis-box">
                  <div style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); margin-bottom: 8px;">
                    Context & Commentary — ${currentReading.title}
                  </div>
                  <div>${TextFormatter.formatExegesisHtml(res.exegesis)}</div>
                </div>
              `;
            } else {
              box.innerHTML = `
                <p style="color: var(--danger); font-size: 0.9rem;">
                  Exegesis is currently unavailable (${res.error || 'Server error'}).
                </p>
                <button class="btn btn-quiet" id="btn-generate-exegesis">Tap to retry</button>
              `;
              Router.bindPracticeEvents();
            }
          });
        }

        const nextScrip = document.getElementById('btn-scripture-next');
        if (nextScrip) nextScrip.addEventListener('click', () => PracticeMachine.advanceState(true));

        const nextRefl = document.getElementById('btn-reflection-next');
        if (nextRefl) {
          nextRefl.addEventListener('click', () => {
            const answers = {
              q1: document.getElementById('refl-q1').value,
              q2: document.getElementById('refl-q2').value,
              q3: document.getElementById('refl-q3').value
            };
            AppState.activeSession.reflections = answers;
            AppState.todayReflection.q1 = answers.q1;
            AppState.todayReflection.q2 = answers.q2;
            AppState.todayReflection.q3 = answers.q3;
            localStorage.setItem(STORAGE_KEY_TODAY_REFLECTION, JSON.stringify(AppState.todayReflection));

            const currentReading = AppState.readings[AppState.currentReadingIndex] || AppState.readings[0];
            ApiService.request('saveReflection', {
              reflection: {
                sessionId: AppState.activeSession.sessionId,
                date: AppState.activeSession.date,
                readingRef: currentReading ? currentReading.title : "Today's Reading",
                answers: answers
              }
            });

            PracticeMachine.persistCurrentSession();
            PracticeMachine.advanceState(true);
          });
        }

        const nextPrayer = document.getElementById('btn-prayer-next');
        if (nextPrayer) nextPrayer.addEventListener('click', () => PracticeMachine.advanceState(true));

        document.querySelectorAll('#experience-pills .pill-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('#experience-pills .pill-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
          });
        });

        const nextExp = document.getElementById('btn-review-next');
        if (nextExp) {
          nextExp.addEventListener('click', () => {
            const selected = document.querySelector('#experience-pills .pill-btn.selected');
            AppState.activeSession.experience = selected ? selected.dataset.val : 'Fine';
            AppState.activeSession.experienceNote = document.getElementById('exp-note').value;
            PracticeMachine.persistCurrentSession();
            PracticeMachine.advanceState(true);
          });
        }

        // Intention item selection
        document.querySelectorAll('.intention-item').forEach(item => {
          item.addEventListener('click', (e) => {
            if (e.target.classList.contains('btn-item-action') || e.target.classList.contains('intention-drag-handle')) return;
            document.querySelectorAll('.intention-item').forEach(i => i.classList.remove('selected'));
            item.classList.add('selected');
            const txt = decodeURIComponent(item.dataset.text);
            AppState.lastChosenIntention = txt;
            localStorage.setItem(STORAGE_KEY_LAST_INTENTION, txt);
            if (AppState.activeSession) AppState.activeSession.selectedIntention = txt;
          });
        });

        // Intention Move Up / Down Buttons
        document.querySelectorAll('.btn-move-up').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = parseInt(btn.dataset.idx, 10);
            if (idx > 0) {
              const list = AppState.settings.predefinedIntentions;
              const temp = list[idx];
              list[idx] = list[idx - 1];
              list[idx - 1] = temp;
              localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(AppState.settings));
              Router.render();
            }
          });
        });

        document.querySelectorAll('.btn-move-down').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = parseInt(btn.dataset.idx, 10);
            const list = AppState.settings.predefinedIntentions;
            if (idx < list.length - 1) {
              const temp = list[idx];
              list[idx] = list[idx + 1];
              list[idx + 1] = temp;
              localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(AppState.settings));
              Router.render();
            }
          });
        });

        // Intention Drag and Drop support
        let dragStartIndex = -1;
        document.querySelectorAll('.intention-item').forEach(item => {
          item.addEventListener('dragstart', (e) => {
            dragStartIndex = parseInt(item.dataset.index, 10);
            item.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
          });

          item.addEventListener('dragend', () => {
            item.classList.remove('dragging');
          });

          item.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
          });

          item.addEventListener('drop', (e) => {
            e.preventDefault();
            const dropIndex = parseInt(item.dataset.index, 10);
            if (dragStartIndex !== -1 && dragStartIndex !== dropIndex) {
              const list = AppState.settings.predefinedIntentions;
              const [movedItem] = list.splice(dragStartIndex, 1);
              list.splice(dropIndex, 0, movedItem);
              localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(AppState.settings));
              Router.render();
            }
          });
        });

        const addIntentionBtn = document.getElementById('btn-add-intention');
        if (addIntentionBtn) {
          addIntentionBtn.addEventListener('click', () => {
            const input = document.getElementById('new-intention-input');
            const val = input.value.trim();
            if (!val) return;

            const newId = 'p_' + Date.now();
            AppState.settings.predefinedIntentions.push({ id: newId, text: val });
            AppState.lastChosenIntention = val;
            localStorage.setItem(STORAGE_KEY_LAST_INTENTION, val);
            if (AppState.activeSession) AppState.activeSession.selectedIntention = val;
            
            localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(AppState.settings));
            Router.render();
          });
        }

        document.querySelectorAll('.btn-edit-intention').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.dataset.id;
            const item = AppState.settings.predefinedIntentions.find(p => p.id === id);
            if (!item) return;

            const updated = prompt("Edit your implementation intention:", item.text);
            if (updated && updated.trim()) {
              item.text = updated.trim();
              if (AppState.lastChosenIntention === item.text) {
                AppState.lastChosenIntention = updated.trim();
                localStorage.setItem(STORAGE_KEY_LAST_INTENTION, updated.trim());
              }
              if (AppState.activeSession && AppState.activeSession.selectedIntention === item.text) {
                AppState.activeSession.selectedIntention = updated.trim();
              }
              localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(AppState.settings));
              Router.render();
            }
          });
        });

        document.querySelectorAll('.btn-del-intention').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.dataset.id;
            ModalService.showConfirm("Delete this intention from your options?", () => {
              AppState.settings.predefinedIntentions = AppState.settings.predefinedIntentions.filter(p => p.id !== id);
              localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(AppState.settings));
              Router.render();
            });
          });
        });

        const confirmIntention = document.getElementById('btn-intention-confirm');
        if (confirmIntention) {
          confirmIntention.addEventListener('click', () => {
            const selectedItem = document.querySelector('.intention-item.selected');
            if (selectedItem) {
              const intentionText = decodeURIComponent(selectedItem.dataset.text);
              AppState.activeSession.selectedIntention = intentionText;
              AppState.lastChosenIntention = intentionText;
              localStorage.setItem(STORAGE_KEY_LAST_INTENTION, intentionText);
            }
            PracticeMachine.advanceState(true);
          });
        }

        const compHome = document.getElementById('btn-complete-home');
        if (compHome) {
          compHome.addEventListener('click', () => PracticeMachine.advanceState(true));
        }
      }

              <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.95rem;">
                <span>Peaceful: <strong>${h.meditationExperience.Peaceful || 0}</strong></span>
                <span>Fine: <strong>${h.meditationExperience.Fine || 0}</strong></span>
                <span>Struggle: <strong>${h.meditationExperience.Struggle || 0}</strong></span>
              </div>
            </div>

            <h3>Daily Intention Reviews</h3>
            <div style="display: flex; justify-content: space-between; margin: 10px 0 20px; font-size: 0.95rem;">
              <span>Well: <strong>${h.intentionReviews.Well || 0}</strong></span>
              <span>OK: <strong>${h.intentionReviews.OK || 0}</strong></span>
              <span>Poorly: <strong>${h.intentionReviews.Poorly || 0}</strong></span>
            </div>

            <h3>Recent Sessions</h3>
            <ul class="flow-list">
              ${(h.recentSessions && h.recentSessions.length > 0) ? h.recentSessions.map(s => `
                <li class="flow-item">
                  <span>${s.date}</span>
                  <span style="color: var(--text-muted); font-variant-numeric: tabular-nums;">${s.duration} min</span>
                  <span class="flow-indicator done">✓</span>
                </li>
              `).join('') : '<li class="flow-item"><span style="color:var(--text-muted);">No sessions recorded in OneDay yet.</span></li>'}
            </ul>
          `;

          const legacyBtn = document.getElementById('btn-open-legacy-sync');
          if (legacyBtn) {
            legacyBtn.addEventListener('click', () => {
              const currentLeg = h.legacy || {};
              const pCount = prompt("Total previous practice sessions (from Hallow):", currentLeg.practices || 0);
              if (pCount === null) return;

              const mCount = prompt("Total previous practice minutes (e.g. 1500):", currentLeg.minutes || 0);
              if (mCount === null) return;

              const sCount = prompt("Current active streak in days (from Hallow):", currentLeg.streak || 0);
              if (sCount === null) return;

              const lastDate = prompt("Date of last completed session in Hallow (YYYY-MM-DD):", currentLeg.lastDate || new Date().toISOString().split('T')[0]);
              if (lastDate === null) return;

              ApiService.request('setLegacyStats', {
                legacy: {
                  practices: parseInt(pCount, 10) || 0,
                  minutes: parseInt(mCount, 10) || 0,
                  streak: parseInt(sCount, 10) || 0,
                  lastDate: lastDate.trim()
                }
              }).then(resp => {
                if (resp.success) {
                  ModalService.showAlert("Hallow practice history unified with OneDay.", () => {
                    Router.loadHistoryData();
                  });
                }
              });
            });
          }
        } else {
          container.innerHTML = `<p style="color:var(--text-muted);">Log in to view your synchronized practice history and stats.</p>`;
        }
      }

      static renderSettingsView() {
        return `
          <div class="card">
            <h2>Personal Preferences</h2>
            <p>Customize your default meditation and chime preferences.</p>

            <div class="input-group">
              <label>Default Focused Attention (Minutes)</label>
              <input type="number" id="pref-focused" value="${AppState.settings.focusedDuration}">
            </div>

            <div class="input-group">
              <label>Default Open Monitoring (Minutes)</label>
              <input type="number" id="pref-open" value="${AppState.settings.openDuration}">
            </div>

            <div class="input-group">
              <label>Gentle Singing Bowl Bell</label>
              <select id="pref-audio">
                <option value="true" ${sound.enabled ? 'selected' : ''}>Enabled</option>
                <option value="false" ${!sound.enabled ? 'selected' : ''}>Muted</option>
              </select>
            </div>

            <button class="btn btn-primary" id="btn-save-prefs">Save Preferences</button>
          </div>
        `;
      }

      static bindSettingsEvents() {
        const btn = document.getElementById('btn-save-prefs');
        if (btn) {
          btn.addEventListener('click', () => {
            AppState.settings.focusedDuration = parseInt(document.getElementById('pref-focused').value, 10);
            AppState.settings.openDuration = parseInt(document.getElementById('pref-open').value, 10);
            sound.enabled = document.getElementById('pref-audio').value === 'true';

            localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(AppState.settings));
            ModalService.showAlert("Preferences saved successfully.");
          });
        }
      }

      static renderAdminView() {
        if (!AppState.currentUser || AppState.currentUser.role !== 'admin') {
          return `<div class="card"><p>Admin access required.</p></div>`;
        }

        return `
          <div class="card">
            <span class="status-banner">Admin Console</span>
            <h2>Administration</h2>
            <p>Manage users, exegesis prompts, and prayer templates.</p>

            <div class="input-group">
              <label>Master AI Exegesis Prompt</label>
              <textarea id="admin-prompt" style="height: 140px;">${AppState.settings.exegesisPrompt || ''}</textarea>
            </div>

            <div class="input-group">
              <label>Universalis Scripture Feed URL</label>
              <input type="text" id="admin-uni-url" value="${AppState.settings.universalisUrl || ''}">
            </div>

            <button class="btn btn-primary" id="btn-save-admin-settings">Save App Configuration</button>
          </div>

          <div class="card">
            <h3>Registered Users</h3>
            <div id="admin-users-list">
              <p style="color: var(--text-muted);">Loading user records...</p>
            </div>
          </div>
        `;
      }

      static async bindAdminEvents() {
        const saveBtn = document.getElementById('btn-save-admin-settings');
        if (saveBtn) {
          saveBtn.addEventListener('click', async () => {
            const p = document.getElementById('admin-prompt').value;
            const u = document.getElementById('admin-uni-url').value;

            const res = await ApiService.request('adminSaveSettings', {
              settings: { exegesisPrompt: p, universalisUrl: u }
            });

            if (res.success) ModalService.showAlert("Configuration updated.");
            else ModalService.showAlert("Error: " + res.error);
          });
        }

        const userContainer = document.getElementById('admin-users-list');
        if (userContainer) {
          const res = await ApiService.request('adminGetUsers');
          if (res.success && res.users) {
            userContainer.innerHTML = `
              <ul class="flow-list">
                ${res.users.map(u => `
                  <li class="flow-item">
                    <div>
                      <strong>${u.name}</strong><br>
                      <small style="color: var(--text-muted);">${u.email} (${u.role})</small>
                    </div>
                    <span style="font-size: 0.85rem; color: ${u.active ? 'var(--success)' : 'var(--danger)'};">
                      ${u.active ? 'Active' : 'Inactive'}
                    </span>
                  </li>
                `).join('')}
              </ul>
            `;
          }
        }
      }

      static renderAuthView() {
        if (AppState.currentUser) {
          return `
            <div class="card">
              <h2>Account</h2>
              <p>Logged in as <strong>${AppState.currentUser.name}</strong> (${AppState.currentUser.email})</p>
              <p>Role: ${AppState.currentUser.role}</p>

              <div class="input-group" style="margin-top: 20px;">
                <label>Change Password</label>
                <input type="password" id="auth-new-pass" placeholder="New Password (min 8 chars)">
              </div>

              <div class="btn-group">
                <button class="btn btn-secondary" id="btn-change-pass">Update Password</button>
                <button class="btn btn-quiet" id="btn-logout" style="color: var(--danger);">Log Out</button>
              </div>
            </div>
          `;
        }

        return `
          <div class="card">
            <h2>Log In</h2>
            <p>Access your personal practice, reflections, and history.</p>

            <div class="input-group">
              <label>Email Address</label>
              <input type="email" id="login-email" placeholder="name@domain.com" required>
            </div>

            <div class="input-group">
              <label>Password</label>
              <input type="password" id="login-password" required>
            </div>

            <div id="login-error" style="color: var(--danger); font-size: 0.9rem; margin-bottom: 12px;" class="hidden"></div>

            <button class="btn btn-primary" id="btn-submit-login">Log In</button>
          </div>
        `;
      }

      static bindAuthEvents() {
        const loginBtn = document.getElementById('btn-submit-login');
        if (loginBtn) {
          loginBtn.addEventListener('click', async () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            const errBox = document.getElementById('login-error');

            errBox.classList.add('hidden');
            const res = await ApiService.request('login', { email: email, password: pass });

            if (res.success) {
              AppState.currentUser = res.user;
              AppState.authToken = res.token;
              localStorage.setItem(STORAGE_KEY_AUTH, JSON.stringify({ user: res.user, token: res.token }));
              Router.updateHeaderProfileBadge();
              Router.syncTodayReflectionFromBackend();
              Router.navigate('today');
            } else {
              errBox.textContent = res.error || "Login failed.";
              errBox.classList.remove('hidden');
            }
          });
        }

        const logoutBtn = document.getElementById('btn-logout');
        if (logoutBtn) {
          logoutBtn.addEventListener('click', () => {
            AppState.currentUser = null;
            AppState.authToken = null;
            localStorage.removeItem(STORAGE_KEY_AUTH);
            Router.updateHeaderProfileBadge();
            Router.navigate('today');
          });
        }
      }
    }

    /**
     * Application bootstrapping
     */
    window.addEventListener('DOMContentLoaded', async () => {
      const savedSettings = localStorage.getItem(STORAGE_KEY_SETTINGS);
      if (savedSettings) {
        try { Object.assign(AppState.settings, JSON.parse(savedSettings)); } catch (e) {}
      }

      const savedIntention = localStorage.getItem(STORAGE_KEY_LAST_INTENTION);
      if (savedIntention) {
        AppState.lastChosenIntention = savedIntention;
      }

      const savedCache = localStorage.getItem(STORAGE_KEY_EXEGESIS_CACHE);
      if (savedCache) {
        try { AppState.exegesisCache = JSON.parse(savedCache); } catch (e) {}
      }

      const savedReflection = localStorage.getItem(STORAGE_KEY_TODAY_REFLECTION);
      if (savedReflection) {
        try {
          const parsed = JSON.parse(savedReflection);
          const todayStr = new Date().toISOString().split('T')[0];
          if (parsed.date === todayStr) {
            Object.assign(AppState.todayReflection, parsed);
          }
        } catch (e) {}
      }

      const savedAuth = localStorage.getItem(STORAGE_KEY_AUTH);
      if (savedAuth) {
        try {
          const parsed = JSON.parse(savedAuth);
          AppState.currentUser = parsed.user;
          AppState.authToken = parsed.token;
        } catch (e) {}
      }

      Router.init();
    });
  </script>
</body>
</html>
